name: Update NOWNEX FOOTBALL News

on:
  workflow_dispatch:

  schedule:
    # تحديث كل 3 ساعات
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch NOWNEX FOOTBALL News
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape
          import html as html_lib
          import re
          import time

          NEWS_FILE = "data/news.json"
          MAX_PER_CATEGORY = 10
          MAX_TOTAL = 50

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36"
          )

          feeds = [
              {
                  "category": "matches",
                  "name": "أقوى المواجهات",
                  "queries": [
                      "مباريات كرة القدم اليوم",
                      "أقوى مباريات كرة القدم",
                      "المواجهات الكبرى كرة القدم",
                      "معاينة مباريات كرة القدم"
                  ]
              },
              {
                  "category": "transfers",
                  "name": "أخبار الانتقالات",
                  "queries": [
                      "انتقالات كرة القدم",
                      "سوق الانتقالات كرة القدم",
                      "صفقات كرة القدم",
                      "أخبار انتقالات اللاعبين"
                  ]
              },
              {
                  "category": "stars",
                  "name": "أخبار النجوم",
                  "queries": [
                      "نجوم كرة القدم",
                      "أخبار لاعبي كرة القدم",
                      "إصابات لاعبي كرة القدم",
                      "تصريحات نجوم كرة القدم"
                  ]
              },
              {
                  "category": "national",
                  "name": "المنتخبات",
                  "queries": [
                      "أخبار المنتخبات الوطنية",
                      "منتخبات كرة القدم",
                      "كأس العالم كرة القدم",
                      "كأس أمم إفريقيا",
                      "تصفيات كأس العالم"
                  ]
              },
              {
                  "category": "history",
                  "name": "تاريخ في الكرة",
                  "queries": [
                      "أساطير كرة القدم",
                      "تاريخ كرة القدم",
                      "اللحظات التاريخية كرة القدم",
                      "نهائيات تاريخية كرة القدم",
                      "لاعبون معتزلون كرة القدم"
                  ]
              }
          ]

          def clean_text(value):
              if not value:
                  return ""

              value = unescape(str(value))
              value = html_lib.unescape(value)

              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S
              )
              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def get_text(item, tag):
              element = item.find(tag)
              if element is None:
                  return ""
              return element.text or ""

          def normalize_url(url, base=""):
              if not url:
                  return ""
              url = unescape(url).strip()

              if url.startswith("//"):
                  return "https:" + url

              if base:
                  return urllib.parse.urljoin(base, url)

              return url

          def http_get(url, timeout=15, max_bytes=1800000):
              if not url:
                  return "", url, ""

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                          "Accept-Language": "ar,en-US;q=0.9,en;q=0.8",
                      }
                  )

                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      final_url = response.geturl() or url
                      content_type = (
                          response.headers.get("content-type", "")
                          .lower()
                      )
                      data = response.read(max_bytes)

                      text = data.decode("utf-8", errors="ignore")

                      return text, final_url, content_type

              except Exception as error:
                  print("GET ERROR:", str(error)[:250])
                  return "", url, ""

          def resolve_url(url):
              if not url:
                  return ""

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": USER_AGENT}
                  )

                  with urllib.request.urlopen(req, timeout=15) as response:
                      return response.geturl() or url

              except Exception as error:
                  print("Resolve error:", str(error)[:200])
                  return url

          def get_rss_image(item):
              for element in item.iter():
                  tag = element.tag
                  if not isinstance(tag, str):
                      continue

                  tag_lower = tag.lower()

                  if tag_lower.endswith("content"):
                      url = element.attrib.get("url")
                      if url and url.startswith("http"):
                          return url.strip()

              for element in item.iter():
                  tag = element.tag
                  if not isinstance(tag, str):
                      continue

                  if tag.lower().endswith("thumbnail"):
                      url = element.attrib.get("url")
                      if url and url.startswith("http"):
                          return url.strip()

              enclosure = item.find("enclosure")
              if enclosure is not None:
                  url = enclosure.attrib.get("url")
                  if url and url.startswith("http"):
                      return url.strip()

              return ""

          def meta_content(page, attribute, value):
              patterns = [
                  rf'<meta[^>]+{attribute}\s*=\s*["\']{re.escape(value)}["\'][^>]+content\s*=\s*["\']([^"\']+)',
                  rf'<meta[^>]+content\s*=\s*["\']([^"\']+)["\'][^>]+{attribute}\s*=\s*["\']{re.escape(value)}["\']'
              ]

              for pattern in patterns:
                  match = re.search(pattern, page, flags=re.I)
                  if match:
                      return clean_text(match.group(1))

              return ""

          def extract_jsonld_article_body(page):
              matches = re.findall(
                  r'"articleBody"\s*:\s*"((?:\\.|[^"\\])*)"',
                  page,
                  flags=re.I | re.S
              )

              bodies = []

              for raw in matches:
                  try:
                      decoded = json.loads('"' + raw + '"')
                  except Exception:
                      decoded = raw

                  decoded = clean_text(decoded)

                  if len(decoded) >= 150:
                      bodies.append(decoded)

              if not bodies:
                  return ""

              return max(bodies, key=len)

          def extract_paragraphs(page):
              paragraphs = re.findall(
                  r"<p\b[^>]*>(.*?)</p>",
                  page,
                  flags=re.I | re.S
              )

              result = []

              for paragraph in paragraphs:
                  paragraph = clean_text(paragraph)

                  if len(paragraph) < 45:
                      continue

                  low = paragraph.lower()

                  bad = [
                      "اشترك",
                      "تسجيل الدخول",
                      "تابعنا",
                      "إعلان",
                      "privacy policy",
                      "terms of use",
                      "cookie",
                      "حقوق النشر",
                      "جميع الحقوق"
                  ]

                  if any(word.lower() in low for word in bad):
                      continue

                  result.append(paragraph)

                  if len(result) >= 12:
                      break

              return " ".join(result)

          def extract_page(url):
              """
              محاولة أولى: الموقع الأصلي.
              محاولة ثانية: Jina Reader كقارئ صفحات عام.
              """
              result = {
                  "url": url,
                  "title": "",
                  "description": "",
                  "image": "",
                  "text": ""
              }

              if not url:
                  return result

              page, final_url, content_type = http_get(url)

              if page:
                  result["url"] = final_url or url

                  result["title"] = (
                      meta_content(page, "property", "og:title")
                      or meta_content(page, "name", "twitter:title")
                  )

                  if not result["title"]:
                      match = re.search(
                          r"<title[^>]*>(.*?)</title>",
                          page,
                          flags=re.I | re.S
                      )
                      if match:
                          result["title"] = clean_text(match.group(1))

                  result["description"] = (
                      meta_content(page, "name", "description")
                      or meta_content(page, "property", "og:description")
                  )

                  result["image"] = (
                      meta_content(page, "property", "og:image")
                      or meta_content(page, "name", "twitter:image")
                  )

                  result["image"] = normalize_url(
                      result["image"],
                      result["url"]
                  )

                  body = extract_jsonld_article_body(page)

                  if len(body) < 150:
                      body = extract_paragraphs(page)

                  result["text"] = body

                  if len(result["text"]) >= 180:
                      return result

              # Jina Reader
              try:
                  jina_url = (
                      "https://r.jina.ai/"
                      + (final_url or url)
                  )

                  reader, reader_url, _ = http_get(
                      jina_url,
                      timeout=25,
                      max_bytes=2200000
                  )

                  if reader:
                      reader = clean_text(reader)

                      # إزالة بعض رؤوس Jina/Markdown الشائعة
                      reader = re.sub(
                          r"^Title:.*?(?=URL Source:|Published Time:|Markdown Content:)",
                          " ",
                          reader,
                          flags=re.I | re.S
                      )
                      reader = re.sub(
                          r"^URL Source:.*?(?=Published Time:|Markdown Content:)",
                          " ",
                          reader,
                          flags=re.I | re.S
                      )
                      reader = re.sub(
                          r"^Published Time:.*?(?=Markdown Content:)",
                          " ",
                          reader,
                          flags=re.I | re.S
                      )
                      reader = re.sub(
                          r"^Markdown Content:",
                          " ",
                          reader,
                          flags=re.I
                      )

                      reader = clean_text(reader)

                      if len(reader) > len(result["text"]):
                          result["text"] = reader

                      if not result["title"]:
                          lines = [
                              x.strip()
                              for x in reader.split(" ")
                              if x.strip()
                          ]
                          if lines:
                              result["title"] = " ".join(lines[:20])

              except Exception as error:
                  print("Jina error:", str(error)[:200])

              return result

          def remove_title_from_text(text, title):
              if not text:
                  return ""

              text = clean_text(text)

              if title:
                  text = re.sub(
                      re.escape(title),
                      " ",
                      text,
                      flags=re.I
                  )

              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def make_summary(title, rss_description, page_description, article_text):
              candidates = [
                  article_text,
                  page_description,
                  rss_description
              ]

              best = ""

              for candidate in candidates:
                  candidate = remove_title_from_text(
                      candidate,
                      title
                  )

                  if len(candidate) > len(best):
                      best = candidate

              if not best:
                  return "يتابع NOWNEX FOOTBALL هذا الخبر ويقدم أهم تفاصيله وتطوراته من المصدر الأصلي."

              # تحويل Markdown البسيط إلى نص
              best = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", best)
              best = re.sub(r"#{1,6}\s*", "", best)
              best = re.sub(r"\s+", " ", best).strip()

              # إذا كانت الصفحة تحتوي نصًا طويلًا، نأخذ ملخصًا
              # محدودًا بدل نسخ المقال.
              sentences = re.split(
                  r"(?<=[.!؟])\s+",
                  best
              )

              selected = []
              words = 0

              for sentence in sentences:
                  sentence = sentence.strip()

                  if len(sentence) < 30:
                      continue

                  count = len(sentence.split())

                  if selected and words + count > 115:
                      break

                  selected.append(sentence)
                  words += count

                  if words >= 75:
                      break

              summary = " ".join(selected).strip()

              if len(summary.split()) < 25:
                  words_list = best.split()
                  summary = " ".join(words_list[:90])

              # لا نسمح بأن يكون الملخص مجرد العنوان.
              if title and summary.lower().strip() == title.lower().strip():
                  summary = ""

              if not summary:
                  summary = (
                      "تفاصيل الخبر متوفرة عبر المصدر الأصلي، "
                      "ويمكن متابعة التطورات من خلال الرابط المباشر."
                  )

              return summary

          articles = []

          for feed in feeds:
              category = feed["category"]
              category_articles = []

              print("")
              print("======================================")
              print("CATEGORY:", feed["name"])
              print("======================================")

              for query in feed["queries"]:
                  if len(category_articles) >= MAX_PER_CATEGORY:
                      break

                  rss_url = (
                      "https://news.google.com/rss/search?"
                      "q=" + urllib.parse.quote(query)
                      + "&hl=ar&gl=DZ&ceid=DZ:ar"
                  )

                  print("Searching:", query)

                  try:
                      rss_xml, _, _ = http_get(
                          rss_url,
                          timeout=30,
                          max_bytes=900000
                      )

                      if not rss_xml:
                          continue

                      root = ET.fromstring(rss_xml)

                      for item in root.findall(".//item"):
                          if len(category_articles) >= MAX_PER_CATEGORY:
                              break

                          title = clean_text(
                              get_text(item, "title")
                          )

                          description = clean_text(
                              get_text(item, "description")
                          )

                          link = clean_text(
                              get_text(item, "link")
                          )

                          pub_date = clean_text(
                              get_text(item, "pubDate")
                          )

                          source = clean_text(
                              get_text(item, "source")
                          )

                          title = re.sub(
                              r"\s*-\s*Google News\s*$",
                              "",
                              title,
                              flags=re.I
                          ).strip()

                          if not title or not link:
                              continue

                          key = re.sub(
                              r"\s+",
                              " ",
                              title.lower()
                          ).strip()

                          if any(
                              x["_key"] == key
                              for x in category_articles
                          ):
                              continue

                          print("")
                          print("TITLE:", title)

                          original_link = resolve_url(link)

                          print(
                              "SOURCE URL:",
                              original_link
                          )

                          page = extract_page(original_link)

                          summary = make_summary(
                              title,
                              description,
                              page.get("description", ""),
                              page.get("text", "")
                          )

                          image = (
                              page.get("image")
                              or get_rss_image(item)
                              or ""
                          )

                          image = normalize_url(
                              image,
                              page.get("url") or original_link
                          )

                          # لا نحذف الخبر إذا تعذر استخراج المقال.
                          # نحتفظ بخبر RSS بدل أن تصبح الصفحة فارغة.
                          article = {
                              "category": category,
                              "title_ar": title,
                              "summary_ar": summary,
                              "image": image,
                              "source": (
                                  source
                                  or "NOWNEX FOOTBALL"
                              ),
                              "link": (
                                  page.get("url")
                                  or original_link
                              ),
                              "published": pub_date,
                              "date": pub_date,
                              "_key": key
                          }

                          category_articles.append(article)

                          print(
                              "SUMMARY WORDS:",
                              len(summary.split())
                          )
                          print(
                              "IMAGE:",
                              "FOUND" if image else "NOT FOUND"
                          )

                          time.sleep(0.25)

                  except Exception as error:
                      print(
                          "RSS ERROR:",
                          str(error)[:500]
                      )

              articles.extend(category_articles)

              print(
                  "CATEGORY ARTICLES:",
                  len(category_articles)
              )

          # إزالة التكرار بين الأقسام
          unique = {}

          for article in articles:
              key = article["_key"]

              if key not in unique:
                  unique[key] = article

          articles = list(unique.values())

          # الأحدث أولًا
          articles.sort(
              key=lambda x: x.get("published", "") or "",
              reverse=True
          )

          articles = articles[:MAX_TOTAL]

          for article in articles:
              article.pop("_key", None)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(articles),
              "news": articles
          }

          # حماية مهمة:
          # لا نستبدل news.json بملف فارغ إذا فشل Google News.
          if len(articles) == 0:
              print("ERROR: No articles collected.")
              print("Keeping the existing data/news.json unchanged.")
              raise SystemExit(1)

          with open(
              NEWS_FILE,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("======================================")
          print(
              "NOWNEX FOOTBALL NEWS SAVED:",
              len(articles)
          )
          print("======================================")

          for feed in feeds:
              count = sum(
                  1
                  for article in articles
                  if article["category"] == feed["category"]
              )

              print(
                  feed["category"],
                  ":",
                  count
              )

      - name: Commit updated news
        run: |
          git config user.name "NOWNEX Football News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || \
            git commit -m "Update NOWNEX FOOTBALL news"

          git push
