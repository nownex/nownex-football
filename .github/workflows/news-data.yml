name: Update NOWNEX FOOTBALL News

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Build NOWNEX FOOTBALL News
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import os
          import json
          import re
          import time
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import quote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup


          # ============================================================
          # NOWNEX FOOTBALL ENGINE
          # ============================================================

          NEWS_FILE = "data/news.json"

          PER_CATEGORY = 10
          MAX_TOTAL = 50

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/136.0.0.0 Safari/537.36 "
                  "NOWNEX-NewsBot/4.0"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;"
                  "q=0.9,image/avif,image/webp,*/*;q=0.8"
              ),
              "Accept-Language": "ar,en-US;q=0.8,en;q=0.6",
              "Cache-Control": "no-cache",
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)


          # ============================================================
          # CATEGORY DEFINITIONS
          #
          # IMPORTANT:
          # Each category now has its OWN search pool.
          # We no longer classify the whole world of football into
          # categories using one weak classifier.
          # ============================================================

          CATEGORIES = {

              "matches": {
                  "queries": [
                      "كرة القدم مباريات اليوم نتائج أهداف",
                      "مباريات كرة القدم اليوم تشكيلة نتيجة",
                      "مواجهات كرة القدم اليوم",
                      "دوري أبطال أوروبا مباريات نتائج",
                      "الدوري الإنجليزي مباريات نتائج",
                      "الدوري الإسباني مباريات نتائج",
                      "الدوري الإيطالي مباريات نتائج",
                      "الدوري السعودي مباريات نتائج",
                      "football matches today results goals",
                      "Champions League matches results",
                  ],
                  "keywords": [
                      "مباراة", "مباريات", "مواجهة", "نتيجة",
                      "هدف", "أهداف", "تشكيلة", "تشكيل",
                      "الجولة", "لقاء", "دوري", "كأس",
                      "match", "matches", "result", "goal",
                      "lineup", "fixture"
                  ]
              },

              "transfers": {
                  "queries": [
                      "انتقالات كرة القدم اليوم صفقات",
                      "ميركاتو كرة القدم انتقالات لاعبين",
                      "سوق انتقالات اللاعبين صفقات الأندية",
                      "مفاوضات انتقال لاعب كرة القدم",
                      "تعاقدات أندية كرة القدم",
                      "football transfers today",
                      "football transfer news deals",
                      "transfer market football",
                  ],
                  "keywords": [
                      "انتقال", "انتقالات", "صفقة", "صفقات",
                      "ميركاتو", "تعاقد", "ينضم", "ضم",
                      "مفاوضات", "عرض", "رحيل", "إعارة",
                      "عقد", "transfer", "transfers", "deal",
                      "signing", "loan", "contract"
                  ]
              },

              "stars": {
                  "queries": [
                      "أخبار نجوم كرة القدم اليوم",
                      "محمد صلاح أخبار اليوم",
                      "مبابي أخبار اليوم",
                      "رونالدو أخبار اليوم",
                      "هالاند أخبار اليوم",
                      "لامين يامال أخبار اليوم",
                      "فينيسيوس أخبار اليوم",
                      "بيلينغهام أخبار اليوم",
                      "محرز أخبار اليوم",
                      "بلايلي أخبار اليوم",
                      "football stars latest news",
                      "Messi Ronaldo Mbappe Salah Haaland latest",
                  ],
                  "keywords": [
                      "رونالدو", "ميسي", "مبابي", "صلاح",
                      "هالاند", "يامال", "لامين", "فينيسيوس",
                      "بيلينغهام", "نيمار", "محرز", "بلايلي",
                      "نجم", "نجوم", "لاعب", "إصابة",
                      "تصريح", "مدرب", "Ronaldo", "Messi",
                      "Mbappe", "Salah", "Haaland", "Yamal"
                  ]
              },

              "national": {
                  "queries": [
                      "المنتخب الجزائري أخبار كرة القدم",
                      "المنتخب الجزائري اليوم",
                      "منتخبات كرة القدم أخبار اليوم",
                      "تصفيات كأس العالم كرة القدم",
                      "كأس أمم إفريقيا أخبار المنتخبات",
                      "كأس العالم أخبار المنتخبات",
                      "FIFA national teams latest",
                      "Algeria national football team",
                      "World Cup qualifiers football",
                      "Africa Cup of Nations teams",
                  ],
                  "keywords": [
                      "منتخب", "منتخبات", "الجزائر",
                      "المنتخب الجزائري", "فيفا", "كأس العالم",
                      "تصفيات", "أمم إفريقيا", "أمم اسيا",
                      "وطني", "national", "fifa",
                      "world cup", "qualifier"
                  ]
              },

              "history": {
                  "queries": [
                      "تاريخ كرة القدم أساطير",
                      "أساطير كرة القدم قصص",
                      "في مثل هذا اليوم كرة القدم",
                      "ذكريات كرة القدم التاريخية",
                      "نهائيات تاريخية كرة القدم",
                      "لحظات لا تنسى في كرة القدم",
                      "football history legends",
                      "on this day football history",
                      "historic football moments",
                  ],
                  "keywords": [
                      "تاريخ", "أسطورة", "أساطير",
                      "ذكرى", "تاريخي", "تاريخية",
                      "في مثل هذا اليوم", "نهائي تاريخي",
                      "لحظة تاريخية", "مسيرة", "معتزل",
                      "legend", "history", "historic",
                      "on this day"
                  ]
              }
          }


          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def clean(value):
              if not value:
                  return ""

              soup = BeautifulSoup(str(value), "html.parser")

              text = soup.get_text(" ", strip=True)

              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def normalize_title(title):
              title = clean(title)

              title = re.sub(
                  r"\s*[-|–—]\s*Google News.*$",
                  "",
                  title,
                  flags=re.I
              )

              title = re.sub(
                  r"\s*[-|–—]\s*[^|–—]{1,60}$",
                  "",
                  title
              )

              return re.sub(r"\s+", " ", title).strip()


          def article_key(title):
              text = normalize_title(title).lower()

              text = re.sub(
                  r"[^\w\u0600-\u06ff ]+",
                  " ",
                  text
              )

              text = re.sub(r"\s+", " ", text).strip()

              return hashlib.sha1(
                  text.encode("utf-8")
              ).hexdigest()


          def valid_url(url):
              if not url:
                  return False

              return url.startswith("http://") or url.startswith("https://")


          # ============================================================
          # HTTP
          # ============================================================

          def fetch(url, timeout=20):
              try:
                  response = SESSION.get(
                      url,
                      timeout=timeout,
                      allow_redirects=True
                  )

                  if response.ok:
                      return (
                          response.text,
                          response.url or url,
                          response.headers.get("content-type", "")
                      )

              except Exception as exc:
                  print(
                      "FETCH ERROR:",
                      str(url)[:120],
                      str(exc)[:180]
                  )

              return "", url, ""


          # ============================================================
          # GOOGLE NEWS RSS
          # ============================================================

          def google_news(query):
              rss_url = (
                  "https://news.google.com/rss/search?"
                  "q=" + quote(query) +
                  "&hl=ar&gl=DZ&ceid=DZ:ar"
              )

              xml, final_url, content_type = fetch(
                  rss_url,
                  timeout=30
              )

              if not xml:
                  return []

              try:
                  soup = BeautifulSoup(xml, "xml")
              except Exception:
                  soup = BeautifulSoup(xml, "html.parser")

              results = []

              for item in soup.find_all("item"):

                  title_tag = item.find("title")
                  link_tag = item.find("link")
                  desc_tag = item.find("description")
                  date_tag = item.find("pubDate")
                  source_tag = item.find("source")

                  title = normalize_title(
                      title_tag.get_text(" ", strip=True)
                      if title_tag else ""
                  )

                  link = (
                      link_tag.get_text(strip=True)
                      if link_tag else ""
                  )

                  description = clean(
                      desc_tag.get_text(" ", strip=True)
                      if desc_tag else ""
                  )

                  published = (
                      date_tag.get_text(" ", strip=True)
                      if date_tag else ""
                  )

                  source = clean(
                      source_tag.get_text(" ", strip=True)
                      if source_tag else ""
                  )

                  # Try to obtain an image directly from RSS.
                  rss_image = ""

                  for tag_name in [
                      "media:content",
                      "media:thumbnail",
                      "enclosure"
                  ]:
                      tag = item.find(tag_name)

                      if tag:
                          rss_image = (
                              tag.get("url")
                              or tag.get("href")
                              or ""
                          )

                          if rss_image:
                              break

                  if title and valid_url(link):

                      results.append({
                          "title": title,
                          "link": link,
                          "description": description,
                          "published": published,
                          "source": source,
                          "rss_image": rss_image
                      })

              return results


          # ============================================================
          # IMAGE EXTRACTION
          # ============================================================

          def meta_content(soup, attr, value):
              tag = soup.find(
                  "meta",
                  attrs={attr: value}
              )

              if not tag:
                  return ""

              return clean(tag.get("content", ""))


          def extract_image(soup, base_url):
              candidates = []

              # --------------------------------------------------------
              # OpenGraph
              # --------------------------------------------------------

              for attr, value in [
                  ("property", "og:image"),
                  ("property", "og:image:url"),
                  ("property", "og:image:secure_url"),
                  ("name", "twitter:image"),
                  ("name", "twitter:image:src")
              ]:
                  image = meta_content(
                      soup,
                      attr,
                      value
                  )

                  if image:
                      candidates.append(image)

              # --------------------------------------------------------
              # JSON-LD
              # --------------------------------------------------------

              for script in soup.find_all(
                  "script",
                  type="application/ld+json"
              ):

                  raw = (
                      script.string
                      or script.get_text()
                      or ""
                  )

                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue

                  objects = []

                  if isinstance(data, list):
                      objects = data

                  elif isinstance(data, dict):
                      objects = [data]

                  for obj in objects:

                      if not isinstance(obj, dict):
                          continue

                      image = obj.get("image")

                      if isinstance(image, str):
                          candidates.append(image)

                      elif isinstance(image, dict):
                          value = image.get("url")

                          if value:
                              candidates.append(value)

                      elif isinstance(image, list):

                          for value in image:

                              if isinstance(value, str):
                                  candidates.append(value)

                              elif isinstance(value, dict):
                                  value = value.get("url")

                                  if value:
                                      candidates.append(value)

              # --------------------------------------------------------
              # link rel=image_src
              # --------------------------------------------------------

              tag = soup.find(
                  "link",
                  attrs={"rel": lambda x:
                         x and "image_src" in x}
              )

              if tag and tag.get("href"):
                  candidates.append(
                      tag.get("href")
                  )

              # --------------------------------------------------------
              # First meaningful article image
              # --------------------------------------------------------

              for img in soup.find_all("img"):

                  src = (
                      img.get("src")
                      or img.get("data-src")
                      or img.get("data-lazy-src")
                      or img.get("data-original")
                      or ""
                  )

                  if not src:
                      continue

                  low = src.lower()

                  if any(
                      bad in low
                      for bad in [
                          "logo",
                          "icon",
                          "avatar",
                          "sprite",
                          "favicon",
                          "placeholder",
                          "advert",
                          "ads",
                          "pixel"
                      ]
                  ):
                      continue

                  width = img.get("width")

                  try:
                      if width and int(re.sub(
                          r"[^\d]",
                          "",
                          str(width)
                      ) or 0) < 250:
                          continue
                  except Exception:
                      pass

                  candidates.append(src)

              # --------------------------------------------------------
              # Normalize and validate
              # --------------------------------------------------------

              for image in candidates:

                  if not image:
                      continue

                  image = urljoin(
                      base_url,
                      image
                  )

                  if not valid_url(image):
                      continue

                  low = image.lower()

                  if low.endswith(
                      (
                          ".svg",
                          ".ico"
                      )
                  ):
                      continue

                  return image

              return ""


          # ============================================================
          # ARTICLE PAGE EXTRACTION
          # ============================================================

          def page_data(url):

              html, final_url, content_type = fetch(
                  url,
                  timeout=22
              )

              if not html:
                  return {
                      "url": final_url or url,
                      "image": "",
                      "description": "",
                      "body": ""
                  }

              soup = BeautifulSoup(
                  html,
                  "lxml"
              )

              image = extract_image(
                  soup,
                  final_url or url
              )

              description = (
                  meta_content(
                      soup,
                      "name",
                      "description"
                  )
                  or
                  meta_content(
                      soup,
                      "property",
                      "og:description"
                  )
              )

              # --------------------------------------------------------
              # JSON-LD articleBody
              # --------------------------------------------------------

              bodies = []

              for script in soup.find_all(
                  "script",
                  type="application/ld+json"
              ):

                  raw = (
                      script.string
                      or script.get_text()
                      or ""
                  )

                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue

                  objects = (
                      data
                      if isinstance(data, list)
                      else [data]
                  )

                  for obj in objects:

                      if not isinstance(obj, dict):
                          continue

                      body = obj.get(
                          "articleBody",
                          ""
                      )

                      if isinstance(body, str):

                          body = clean(body)

                          if len(body) >= 150:
                              bodies.append(body)

              # --------------------------------------------------------
              # Article paragraphs
              # --------------------------------------------------------

              selectors = [
                  "article p",
                  "[itemprop='articleBody'] p",
                  ".article-body p",
                  ".article-content p",
                  ".article__body p",
                  ".story-body p",
                  ".story__body p",
                  ".post-content p",
                  ".entry-content p",
                  ".content-body p",
                  ".news-content p",
                  "main p"
              ]

              paragraphs = []

              blocked = [
                  "cookie",
                  "privacy policy",
                  "terms of service",
                  "اشترك",
                  "تسجيل الدخول",
                  "تابعنا",
                  "إعلان",
                  "advertisement",
                  "newsletter"
              ]

              for selector in selectors:

                  for p in soup.select(selector):

                      text = clean(
                          p.get_text(
                              " ",
                              strip=True
                          )
                      )

                      if len(text) < 45:
                          continue

                      low = text.lower()

                      if any(
                          bad in low
                          for bad in blocked
                      ):
                          continue

                      paragraphs.append(text)

                  if len(paragraphs) >= 10:
                      break

              body = ""

              if bodies:
                  body = max(
                      bodies,
                      key=len
                  )

              elif paragraphs:
                  body = " ".join(
                      paragraphs
                  )

              return {
                  "url": final_url or url,
                  "image": image,
                  "description": description,
                  "body": body
              }


          # ============================================================
          # JINA READER FALLBACK
          # ============================================================

          def jina_reader(url):

              try:

                  reader_url = (
                      "https://r.jina.ai/"
                      + url
                  )

                  text, final_url, _ = fetch(
                      reader_url,
                      timeout=30
                  )

                  text = clean(text)

                  if len(text) < 300:
                      return ""

                  text = re.sub(
                      r"^Title:.*?Markdown Content:",
                      "",
                      text,
                      flags=re.I | re.S
                  )

                  return clean(text)

              except Exception:
                  return ""


          # ============================================================
          # SUMMARY BUILDER
          #
          # Target: 60-100 words.
          # Never invents facts.
          # ============================================================

          def make_summary(
              title,
              rss_description,
              page_description,
              body
          ):

              title_clean = clean(title)

              sources = [
                  body,
                  page_description,
                  rss_description
              ]

              text = ""

              for source in sources:

                  source = clean(source)

                  if len(source) > len(text):
                      text = source

              if not text:
                  return (
                      "تستعرض NOWNEX أحدث التفاصيل المرتبطة بهذا "
                      "الخبر في عالم كرة القدم، مع أهم المعطيات "
                      "المتاحة من المصدر الأصلي."
                  )

              # Remove title repetition.
              if title_clean:
                  text = re.sub(
                      re.escape(title_clean),
                      " ",
                      text,
                      flags=re.I
                  )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

              # Split into sentences.
              sentences = re.split(
                  r"(?<=[.!؟])\s+",
                  text
              )

              selected = []
              words = 0

              for sentence in sentences:

                  sentence = sentence.strip()

                  if len(sentence) < 35:
                      continue

                  n = len(
                      sentence.split()
                  )

                  if selected and words + n > 100:
                      break

                  selected.append(sentence)
                  words += n

                  if words >= 70:
                      break

              result = " ".join(
                  selected
              ).strip()

              # If sentence splitting failed, use a clean excerpt.
              if len(result.split()) < 45:

                  words_list = text.split()

                  result = " ".join(
                      words_list[:100]
                  )

              return result[:1200]


          # ============================================================
          # RELEVANCE
          # ============================================================

          def relevance(article, category):

              cfg = CATEGORIES[category]

              title = article["title"].lower()

              description = article[
                  "description"
              ].lower()

              text = (
                  title
                  + " "
                  + description
              )

              score = 0

              for keyword in cfg["keywords"]:

                  keyword = keyword.lower()

                  if keyword in title:
                      score += 5

                  elif keyword in text:
                      score += 2

              # A category-specific Google News result
              # already has baseline relevance.
              score += 3

              return score


          # ============================================================
          # FETCH CATEGORY POOL
          # ============================================================

          def collect_category(category):

              cfg = CATEGORIES[category]

              pool = {}

              for query in cfg["queries"]:

                  print(
                      f"[{category}] QUERY:",
                      query
                  )

                  try:
                      articles = google_news(
                          query
                      )
                  except Exception as exc:
                      print(
                          "QUERY ERROR:",
                          exc
                      )
                      continue

                  for article in articles:

                      key = article_key(
                          article["title"]
                      )

                      if key not in pool:
                          pool[key] = article

                  # Small pause between requests.
                  time.sleep(0.25)

              articles = list(
                  pool.values()
              )

              articles.sort(
                  key=lambda x:
                  relevance(
                      x,
                      category
                  ),
                  reverse=True
              )

              print(
                  f"[{category}] UNIQUE:",
                  len(articles)
              )

              return articles


          # ============================================================
          # LOAD OLD DATA
          # ============================================================

          old_news = []

          if os.path.exists(NEWS_FILE):

              try:

                  with open(
                      NEWS_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old_data = json.load(f)

                  old_news = old_data.get(
                      "news",
                      []
                  )

                  print(
                      "OLD NEWS:",
                      len(old_news)
                  )

              except Exception as exc:

                  print(
                      "OLD DATA ERROR:",
                      exc
                  )


          old_by_category = {
              category: []
              for category in CATEGORIES
          }

          for item in old_news:

              category = item.get(
                  "category"
              )

              if category in old_by_category:
                  old_by_category[
                      category
                  ].append(item)


          # ============================================================
          # BUILD FINAL DATA
          #
          # IMPORTANT:
          # No global cross-category deduplication.
          # Every category receives its own quota.
          # ============================================================

          final = []

          for category in CATEGORIES:

              print("")
              print(
                  "===================================="
              )
              print(
                  "BUILDING:",
                  category
              )
              print(
                  "===================================="
              )

              candidates = collect_category(
                  category
              )

              selected = []
              selected_keys = set()

              for article in candidates:

                  if len(selected) >= PER_CATEGORY:
                      break

                  key = article_key(
                      article["title"]
                  )

                  if key in selected_keys:
                      continue

                  print(
                      "ARTICLE:",
                      article["title"]
                  )

                  original_url = article[
                      "link"
                  ]

                  data = page_data(
                      original_url
                  )

                  final_url = (
                      data["url"]
                      or original_url
                  )

                  body = data["body"]

                  # Try Jina only when the publisher
                  # did not expose enough article text.
                  if len(body) < 300:

                      reader = jina_reader(
                          final_url
                      )

                      if len(reader) > len(body):
                          body = reader

                  # ----------------------------------------------------
                  # IMAGE STRATEGY
                  #
                  # 1. Publisher page
                  # 2. RSS image
                  # 3. Google News redirect page
                  # ----------------------------------------------------

                  image = data["image"]

                  if not image:

                      rss_image = article.get(
                          "rss_image",
                          ""
                      )

                      if rss_image:
                          image = urljoin(
                              final_url,
                              rss_image
                          )

                  if not image:

                      try:

                          google_html, google_url, _ = fetch(
                              original_url,
                              timeout=18
                          )

                          if google_html:

                              google_soup = BeautifulSoup(
                                  google_html,
                                  "lxml"
                              )

                              image = extract_image(
                                  google_soup,
                                  google_url
                              )

                      except Exception as exc:

                          print(
                              "GOOGLE IMAGE ERROR:",
                              exc
                          )

                  # ----------------------------------------------------
                  # Summary
                  # ----------------------------------------------------

                  summary = make_summary(
                      article["title"],
                      article["description"],
                      data["description"],
                      body
                  )

                  # ----------------------------------------------------
                  # Source
                  # ----------------------------------------------------

                  source = (
                      article["source"]
                      or urlparse(
                          final_url
                      ).netloc
                      or "NOWNEX"
                  )

                  item = {
                      "category": category,
                      "title_ar": normalize_title(
                          article["title"]
                      ),
                      "summary_ar": summary,
                      "image": image or "",
                      "source": source,
                      "link": final_url,
                      "published": article[
                          "published"
                      ],
                      "date": article[
                          "published"
                      ]
                  }

                  selected.append(item)
                  selected_keys.add(key)

                  print(
                      "SUMMARY WORDS:",
                      len(
                          summary.split()
                      )
                  )

                  print(
                      "IMAGE:",
                      "YES"
                      if image
                      else "NO"
                  )

                  time.sleep(0.2)

              # --------------------------------------------------------
              # Category fallback.
              #
              # If Google News temporarily returns too few articles,
              # preserve old articles ONLY for this category.
              # --------------------------------------------------------

              if len(selected) < PER_CATEGORY:

                  print(
                      f"[{category}] "
                      f"Only {len(selected)} fresh articles."
                  )

                  for old in old_by_category[
                      category
                  ]:

                      if len(selected) >= PER_CATEGORY:
                          break

                      key = article_key(
                          old.get(
                              "title_ar",
                              ""
                          )
                      )

                      if key in selected_keys:
                          continue

                      selected.append(old)
                      selected_keys.add(key)

                      print(
                          f"[{category}] "
                          "RESTORED OLD ARTICLE"
                      )

              # --------------------------------------------------------
              # Final category result
              # --------------------------------------------------------

              selected = selected[
                  :PER_CATEGORY
              ]

              final.extend(
                  selected
              )

              print(
                  f"[{category}] FINAL:",
                  len(selected)
              )


          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          counts = {
              category:
              sum(
                  1
                  for item in final
                  if item.get("category")
                  == category
              )
              for category in CATEGORIES
          }

          print("")
          print(
              "=========================================="
          )
          print(
              "NOWNEX FOOTBALL FINAL REPORT"
          )
          print(
              "=========================================="
          )

          for category, count in counts.items():

              print(
                  category,
                  ":",
                  count
              )

          print(
              "TOTAL:",
              len(final)
          )


          # Every category should have at least
          # a meaningful amount of content.
          for category, count in counts.items():

              if count < 5:

                  raise RuntimeError(
                      "Safety stop: category "
                      + category
                      + " has only "
                      + str(count)
                      + " articles."
                  )

          if len(final) < 25:

              raise RuntimeError(
                  "Safety stop: fewer than "
                  "25 football stories."
              )


          # ============================================================
          # SAVE
          # ============================================================

          output = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "count": len(final),

              "categories": counts,

              "news": final
          }


          os.makedirs(
              os.path.dirname(NEWS_FILE),
              exist_ok=True
          )


          with open(
              NEWS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "=========================================="
          )
          print(
              "NOWNEX FOOTBALL SAVED:",
              len(final)
          )
          print(
              "=========================================="
          )


      - name: Commit updated news
        run: |
          git config user.name "NOWNEX Football News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || git commit -m "Rebuild NOWNEX Football news"

          git push
