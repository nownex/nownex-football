name: Update NOWNEX FOOTBALL News

on:

  workflow_dispatch:

  schedule:
    # تحديث كل 3 ساعات
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # تحميل المشروع
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # جلب أخبار كرة القدم
      # =====================================================

      - name: Fetch NOWNEX FOOTBALL News

        shell: python

        run: |

          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape
          import re


          # =================================================
          # إعدادات
          # =================================================

          NEWS_FILE = "data/news.json"

          MAX_PER_CATEGORY = 10

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "Chrome/130 Safari/537.36"
          )


          # =================================================
          # الأقسام
          # =================================================

          feeds = [

              {
                  "category": "matches",
                  "name": "أقوى المواجهات",
                  "queries": [
                      "أقوى مباريات كرة القدم",
                      "مباريات كرة القدم اليوم",
                      "المواجهات الكبرى كرة القدم",
                      "معاينة مباريات كرة القدم"
                  ]
              },

              {
                  "category": "transfers",
                  "name": "أخبار الانتقالات",
                  "queries": [
                      "انتقالات كرة القدم",
                      "سوق الانتقالات كرة القدم",
                      "صفقات كرة القدم",
                      "أخبار انتقالات اللاعبين"
                  ]
              },

              {
                  "category": "stars",
                  "name": "أخبار النجوم",
                  "queries": [
                      "نجوم كرة القدم",
                      "أخبار لاعبي كرة القدم",
                      "إصابات لاعبي كرة القدم",
                      "تصريحات نجوم كرة القدم"
                  ]
              },

              {
                  "category": "national",
                  "name": "المنتخبات",
                  "queries": [
                      "أخبار المنتخبات الوطنية",
                      "منتخبات كرة القدم",
                      "كأس العالم كرة القدم",
                      "كأس أمم إفريقيا",
                      "كأس آسيا",
                      "تصفيات كأس العالم"
                  ]
              },

              {
                  "category": "history",
                  "name": "تاريخ في الكرة",
                  "queries": [
                      "أساطير كرة القدم",
                      "تاريخ كرة القدم",
                      "اللحظات التاريخية كرة القدم",
                      "نهائيات تاريخية كرة القدم",
                      "لاعبون معتزلون كرة القدم"
                  ]
              }

          ]


          # =================================================
          # أدوات
          # =================================================

          def clean_text(text):

              if not text:
                  return ""

              text = unescape(text)

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def get_text(item, tag):

              element = item.find(tag)

              if element is None:
                  return ""

              return element.text or ""


          # =================================================
          # استخراج صورة RSS
          # =================================================

          def get_rss_image(item):

              # media:content
              for element in item.iter():

                  tag = element.tag

                  if not isinstance(tag, str):
                      continue

                  if tag.endswith("content"):

                      url = element.attrib.get("url")

                      if url:
                          return url.strip()

              # media:thumbnail
              for element in item.iter():

                  tag = element.tag

                  if not isinstance(tag, str):
                      continue

                  if tag.endswith("thumbnail"):

                      url = element.attrib.get("url")

                      if url:
                          return url.strip()

              # enclosure
              enclosure = item.find("enclosure")

              if enclosure is not None:

                  url = enclosure.attrib.get("url")

                  if url:
                      return url.strip()

              return ""


          # =================================================
          # استخراج OG IMAGE من الموقع الأصلي
          # =================================================

          def get_page_image(url):

              if not url:
                  return ""

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept":
                              "text/html,application/xhtml+xml"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=12
                  ) as response:

                      content_type = (
                          response.headers
                          .get("content-type", "")
                          .lower()
                      )

                      if "text/html" not in content_type:
                          return ""

                      html = response.read(
                          500000
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  patterns = [

                      r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',

                      r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image',

                      r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)',

                      r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image'

                  ]

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          html,
                          flags=re.I
                      )

                      if match:

                          image = (
                              unescape(
                                  match.group(1)
                              )
                              .strip()
                          )

                          if image.startswith("//"):

                              image = "https:" + image

                          elif image.startswith("/"):

                              parsed = urllib.parse.urlparse(
                                  url
                              )

                              image = (
                                  parsed.scheme
                                  + "://"
                                  + parsed.netloc
                                  + image
                              )

                          if image.startswith("http"):

                              return image

              except Exception as error:

                  print(
                      "Image error:",
                      error
                  )

              return ""


          # =================================================
          # أدوات الوصول للمصدر الأصلي
          # =================================================

          GOOGLE_HOSTS = (
              "news.google.com",
              "google.com",
              "www.google.com"
          )


          def is_google_url(url):

              if not url:
                  return False

              try:
                  host = (
                      urllib.parse.urlparse(url)
                      .netloc
                      .lower()
                  )

                  return (
                      host.endswith("news.google.com")
                      or host == "google.com"
                      or host.endswith(".google.com")
                  )

              except Exception:
                  return False


          def fetch_html(url, timeout=18, max_bytes=1200000):

              if not url:
                  return "", ""

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept":
                              "text/html,application/xhtml+xml",
                          "Accept-Language":
                              "ar,en-US;q=0.9,en;q=0.8",
                          "Referer":
                              "https://news.google.com/"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=timeout
                  ) as response:

                      final_url = response.geturl() or url

                      content_type = (
                          response.headers
                          .get("content-type", "")
                          .lower()
                      )

                      data = response.read(
                          max_bytes
                      )

                      if (
                          "text/html" not in content_type
                          and not data.lstrip().startswith(b"<")
                      ):
                          return "", final_url

                      html = data.decode(
                          "utf-8",
                          errors="ignore"
                      )

                      return html, final_url

              except Exception as error:

                  print(
                      "HTML fetch error:",
                      error
                  )

              return "", url


          def absolutize_url(value, base_url):

              if not value:
                  return ""

              value = unescape(
                  value
              ).strip()

              if value.startswith("//"):
                  return "https:" + value

              return urllib.parse.urljoin(
                  base_url,
                  value
              )


          def find_external_url(html, base_url):

              if not html:
                  return ""

              # canonical
              patterns = [

                  r'<link[^>]+rel=["\'][^"\']*canonical[^"\']*["\'][^>]+href=["\']([^"\']+)',

                  r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\'][^"\']*canonical[^"\']*["\']',

                  r'<meta[^>]+property=["\']og:url["\'][^>]+content=["\']([^"\']+)',

                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:url'
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      flags=re.I
                  )

                  if match:

                      candidate = absolutize_url(
                          match.group(1),
                          base_url
                      )

                      if (
                          candidate.startswith("http")
                          and not is_google_url(candidate)
                      ):
                          return candidate

              # External links inside the Google News article page.
              links = re.findall(
                  r'href=["\']([^"\']+)["\']',
                  html,
                  flags=re.I
              )

              candidates = []

              for link in links:

                  candidate = absolutize_url(
                      link,
                      base_url
                  )

                  if not candidate.startswith("http"):
                      continue

                  if is_google_url(candidate):
                      continue

                  if candidate.startswith(
                      "https://accounts.google."
                  ):
                      continue

                  candidates.append(
                      candidate
                  )

              # Prefer URLs that look like article pages.
              article_words = (
                  "/article/",
                  "/news/",
                  "/sport/",
                  "/football/",
                  "/202",
                  ".html",
                  ".htm"
              )

              for candidate in candidates:

                  if any(
                      word in candidate.lower()
                      for word in article_words
                  ):
                      return candidate

              return (
                  candidates[0]
                  if candidates
                  else ""
              )


          def resolve_url(url):

              if not url:
                  return ""

              # First: normal HTTP redirect.
              html, final_url = fetch_html(
                  url,
                  timeout=18,
                  max_bytes=250000
              )

              if (
                  final_url
                  and not is_google_url(final_url)
              ):
                  return final_url

              # Second: inspect the Google News landing page
              # for canonical / og:url / external article links.
              external = find_external_url(
                  html,
                  final_url or url
              )

              if external:
                  return external

              return (
                  final_url
                  or url
              )


          # =================================================
          # استخراج نص المقال والصورة الأصلية
          # =================================================

          def extract_page_data(url):

              if not url:
                  return {
                      "url": "",
                      "title": "",
                      "description": "",
                      "image": "",
                      "text": ""
                  }

              html, final_url = fetch_html(
                  url,
                  timeout=18,
                  max_bytes=1600000
              )

              # If Google News was not resolved yet,
              # inspect the page for the real source URL.
              if html and is_google_url(final_url):

                  external = find_external_url(
                      html,
                      final_url
                  )

                  if external:

                      source_html, source_final = fetch_html(
                          external,
                          timeout=18,
                          max_bytes=1600000
                      )

                      if source_html:

                          html = source_html
                          final_url = source_final or external

              if not html:
                  return {
                      "url": final_url or url,
                      "title": "",
                      "description": "",
                      "image": "",
                      "text": ""
                  }

              # ---------------------------------------------
              # title
              # ---------------------------------------------

              page_title = ""

              patterns = [

                  r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)',

                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:title',

                  r"<title[^>]*>(.*?)</title>"
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      flags=re.I | re.S
                  )

                  if match:

                      page_title = clean_text(
                          match.group(1)
                      )

                      if page_title:
                          break

              # ---------------------------------------------
              # meta description
              # ---------------------------------------------

              page_description = ""

              patterns = [

                  r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)',

                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']description',

                  r'<meta[^>]+property=["\']og:description["\'][^>]+content=["\']([^"\']+)',

                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:description'
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      flags=re.I
                  )

                  if match:

                      page_description = clean_text(
                          match.group(1)
                      )

                      if page_description:
                          break

              # ---------------------------------------------
              # image: og:image / twitter:image
              # ---------------------------------------------

              page_image = ""

              image_patterns = [

                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',

                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image',

                  r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)',

                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image'
              ]

              for pattern in image_patterns:

                  match = re.search(
                      pattern,
                      html,
                      flags=re.I
                  )

                  if match:

                      candidate = absolutize_url(
                          match.group(1),
                          final_url or url
                      )

                      if candidate.startswith("http"):
                          page_image = candidate
                          break

              # ---------------------------------------------
              # JSON-LD image fallback
              # ---------------------------------------------

              if not page_image:

                  jsonld_blocks = re.findall(
                      r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                      html,
                      flags=re.I | re.S
                  )

                  for block in jsonld_blocks:

                      try:

                          data = json.loads(
                              unescape(block)
                          )

                          objects = (
                              data
                              if isinstance(data, list)
                              else [data]
                          )

                          for obj in objects:

                              if not isinstance(obj, dict):
                                  continue

                              image = obj.get(
                                  "image"
                              )

                              if isinstance(image, str):

                                  candidate = absolutize_url(
                                      image,
                                      final_url or url
                                  )

                                  if candidate.startswith("http"):
                                      page_image = candidate
                                      break

                              elif isinstance(image, dict):

                                  candidate = absolutize_url(
                                      image.get("url", ""),
                                      final_url or url
                                  )

                                  if candidate.startswith("http"):
                                      page_image = candidate
                                      break

                              elif isinstance(image, list):

                                  for image_item in image:

                                      if isinstance(
                                          image_item,
                                          str
                                      ):

                                          candidate = absolutize_url(
                                              image_item,
                                              final_url or url
                                          )

                                          if candidate.startswith("http"):
                                              page_image = candidate
                                              break

                                  if page_image:
                                      break

                          if page_image:
                              break

                      except Exception:
                          continue

              # ---------------------------------------------
              # article text
              # ---------------------------------------------

              article_html = html

              article_html = re.sub(
                  r"<script.*?</script>",
                  " ",
                  article_html,
                  flags=re.I | re.S
              )

              article_html = re.sub(
                  r"<style.*?</style>",
                  " ",
                  article_html,
                  flags=re.I | re.S
              )

              article_html = re.sub(
                  r"<noscript.*?</noscript>",
                  " ",
                  article_html,
                  flags=re.I | re.S
              )

              article_html = re.sub(
                  r"<nav.*?</nav>",
                  " ",
                  article_html,
                  flags=re.I | re.S
              )

              article_html = re.sub(
                  r"<footer.*?</footer>",
                  " ",
                  article_html,
                  flags=re.I | re.S
              )

              paragraphs = re.findall(
                  r"<p[^>]*>(.*?)</p>",
                  article_html,
                  flags=re.I | re.S
              )

              cleaned = []

              bad_words = [
                  "اشترك",
                  "تسجيل الدخول",
                  "تابعنا",
                  "إعلان",
                  "حقوق النشر",
                  "جميع الحقوق محفوظة",
                  "cookie",
                  "privacy policy",
                  "terms of use",
                  "newsletter",
                  "sign in",
                  "subscribe"
              ]

              for paragraph in paragraphs:

                  text_value = clean_text(
                      paragraph
                  )

                  if len(text_value) < 45:
                      continue

                  if any(
                      word.lower()
                      in text_value.lower()
                      for word in bad_words
                  ):
                      continue

                  cleaned.append(
                      text_value
                  )

              # Remove duplicate paragraphs.
              unique_paragraphs = []
              seen = set()

              for paragraph in cleaned:

                  key = re.sub(
                      r"\s+",
                      " ",
                      paragraph
                  ).strip()

                  if key in seen:
                      continue

                  seen.add(key)

                  unique_paragraphs.append(
                      key
                  )

              # Keep enough source material for the summary,
              # but do not store the full article.
              article_text = " ".join(
                  unique_paragraphs[:18]
              )

              return {
                  "url":
                      final_url or url,

                  "title":
                      page_title,

                  "description":
                      page_description,

                  "image":
                      page_image,

                  "text":
                      article_text
              }


          # =================================================
          # إنشاء ملخص الخبر
          # =================================================

          def create_summary(
              title,
              description,
              article_text
          ):

              title = clean_text(title)
              description = clean_text(description)
              article_text = clean_text(article_text)

              # Prefer article text.
              text = article_text

              if len(text) < 180:
                  text = (
                      description
                      or article_text
                  )

              if not text:
                  return ""

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

              # Split Arabic/Latin sentences.
              sentences = re.split(
                  r"(?<=[.!؟])\s+",
                  text
              )

              selected = []
              seen = set()
              total = 0

              for sentence in sentences:

                  sentence = sentence.strip()

                  if len(sentence) < 45:
                      continue

                  key = sentence.lower()

                  if key in seen:
                      continue

                  seen.add(key)

                  # Avoid repeating the title.
                  if (
                      title
                      and key == title.lower()
                  ):
                      continue

                  # Target approximately 80-150 words.
                  # Arabic word boundaries are handled by split().
                  words = sentence.split()

                  if (
                      selected
                      and total >= 80
                      and total + len(words) > 170
                  ):
                      break

                  selected.append(
                      sentence
                  )

                  total += len(words)

                  if total >= 100 and len(selected) >= 3:
                      break

                  if len(selected) >= 5:
                      break

              if selected:

                  summary = " ".join(
                      selected
                  ).strip()

                  if len(summary.split()) >= 70:
                      return summary

              # If the source only gives a short description,
              # use it rather than inventing facts.
              if description:
                  return description

              if article_text:
                  # Conservative fallback: first few complete sentences.
                  fallback_sentences = re.split(
                      r"(?<=[.!؟])\s+",
                      article_text
                  )

                  fallback = " ".join(
                      fallback_sentences[:3]
                  ).strip()

                  return fallback

              return ""


          # =================================================
          # تخزين الأخبار
          # =================================================

          articles = []


          # =================================================
          # معالجة كل قسم
          # =================================================

          for feed in feeds:

              category = feed["category"]

              category_name = feed["name"]

              category_articles = []


              print("")
              print(
                  "======================================"
              )

              print(
                  "CATEGORY:",
                  category_name
              )

              print(
                  "======================================"
              )


              for query in feed["queries"]:

                  if len(category_articles) >= MAX_PER_CATEGORY:
                      break


                  encoded_query = (
                      urllib.parse.quote(query)
                  )


                  rss_url = (
                      "https://news.google.com/rss/search?"
                      "q="
                      + encoded_query
                      + "&hl=ar"
                      + "&gl=DZ"
                      + "&ceid=DZ:ar"
                  )


                  print(
                      "Searching:",
                      query
                  )


                  try:

                      request = urllib.request.Request(
                          rss_url,
                          headers={
                              "User-Agent":
                                  USER_AGENT
                          }
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          xml_data = response.read()


                      root = ET.fromstring(
                          xml_data
                      )


                      items = root.findall(
                          ".//item"
                      )


                      for item in items:

                          if (
                              len(category_articles)
                              >= MAX_PER_CATEGORY
                          ):
                              break


                          title = clean_text(
                              get_text(
                                  item,
                                  "title"
                              )
                          )


                          description = clean_text(
                              get_text(
                                  item,
                                  "description"
                              )
                          )


                          link = clean_text(
                              get_text(
                                  item,
                                  "link"
                              )
                          )


                          pub_date = clean_text(
                              get_text(
                                  item,
                                  "pubDate"
                              )
                          )


                          source = clean_text(
                              get_text(
                                  item,
                                  "source"
                              )
                          )


                          if not title:
                              continue


                          # ---------------------------------
                          # إزالة عبارات Google News
                          # ---------------------------------

                          title = re.sub(
                              r"\s*-\s*Google News\s*$",
                              "",
                              title,
                              flags=re.I
                          ).strip()


                          # ---------------------------------
                          # منع التكرار داخل القسم
                          # ---------------------------------

                          duplicate = False

                          normalized_title = (
                              title
                              .lower()
                              .strip()
                          )


                          for existing in category_articles:

                              if (
                                  existing["_key"]
                                  == normalized_title
                              ):

                                  duplicate = True

                                  break


                          if duplicate:
                              continue


                          # ---------------------------------
                          # الوصول إلى المصدر الأصلي
                          # ---------------------------------

                          original_link = resolve_url(
                              link
                          )

                          print(
                              "Source URL:",
                              original_link
                          )


                          # ---------------------------------
                          # استخراج بيانات المصدر
                          # ---------------------------------

                          page_data = extract_page_data(
                              original_link
                          )

                          source_link = (
                              page_data.get("url")
                              or original_link
                          )

                          page_title = (
                              page_data.get("title")
                              or ""
                          )

                          page_description = (
                              page_data.get("description")
                              or ""
                          )

                          article_text = (
                              page_data.get("text")
                              or ""
                          )

                          # ---------------------------------
                          # إنشاء ملخص حقيقي
                          # ---------------------------------

                          summary = create_summary(
                              title,
                              page_description
                              or description,
                              article_text
                          )

                          # ---------------------------------
                          # الصورة: المصدر الأصلي أولًا
                          # ثم RSS فقط كخطة احتياطية
                          # ---------------------------------

                          image = (
                              page_data.get("image")
                              or ""
                          )

                          if not image:

                              image = get_rss_image(
                                  item
                              )

                          # لا نستخدم صورة عامة للقسم
                          # حتى لا تظهر صورة لا علاقة لها بالخبر.

                          print(
                              "Image:",
                              "FOUND" if image else "NOT FOUND"
                          )

                          print(
                              "Summary words:",
                              len(summary.split())
                          )


                          # ---------------------------------
                          # الخبر
                          # ---------------------------------

                          article = {

                              "category":
                                  category,

                              "title_ar":
                                  (
                                      title
                                      if title
                                      else page_title
                                  ),

                              "summary_ar":
                                  summary,

                              "image":
                                  image,

                              "source":
                                  source
                                  or "NOWNEX FOOTBALL",

                              "link":
                                  source_link,

                              "published":
                                  pub_date,

                              "date":
                                  pub_date,

                              "_key":
                                  normalized_title

                          }


                          category_articles.append(
                              article
                          )


                  except Exception as error:

                      print(
                          "RSS error:",
                          error
                      )


              # -------------------------------------------
              # إضافة أخبار القسم
              # -------------------------------------------

              for article in category_articles:

                  articles.append(
                      article
                  )


              print(
                  "Category articles:",
                  len(category_articles)
              )


          # =================================================
          # إزالة التكرار بين الأقسام
          # =================================================

          unique = {}

          for article in articles:

              key = (
                  article["title_ar"]
                  .lower()
                  .strip()
              )


              if key not in unique:

                  unique[key] = article


          articles = list(
              unique.values()
          )


          # =================================================
          # ترتيب الأخبار
          # =================================================

          def sort_key(article):

              return (
                  article.get(
                      "published",
                      ""
                  )
                  or ""
              )


          articles.sort(
              key=sort_key,
              reverse=True
          )


          # =================================================
          # حذف المفتاح الداخلي
          # =================================================

          for article in articles:

              article.pop(
                  "_key",
                  None
              )


          # =================================================
          # حفظ الملف
          # =================================================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(articles),

              "news":
                  articles

          }


          with open(
              NEWS_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "======================================"
          )

          print(
              "NOWNEX FOOTBALL NEWS SAVED:",
              len(articles)
          )

          print(
              "======================================"
          )


          # =================================================
          # إحصائيات الأقسام
          # =================================================

          for feed in feeds:

              category = feed["category"]

              count = sum(
                  1
                  for article in articles
                  if article["category"] == category
              )

              print(
                  category,
                  ":",
                  count
              )


      # =====================================================
      # حفظ التحديث في GitHub
      # =====================================================

      - name: Commit updated news

        run: |

          git config user.name \
            "NOWNEX Football News Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || \
            git commit \
            -m "Update NOWNEX FOOTBALL news"

          git push
