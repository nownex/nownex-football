name: Update NOWNEX FOOTBALL News

on:

  workflow_dispatch:

  schedule:
    # تحديث كل 3 ساعات
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # تحميل المشروع
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # جلب أخبار كرة القدم
      # =====================================================

      - name: Fetch NOWNEX FOOTBALL News

        shell: python

        run: |

          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape
          import re


          # =================================================
          # إعدادات
          # =================================================

          NEWS_FILE = "data/news.json"

          MAX_PER_CATEGORY = 10

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "Chrome/130 Safari/537.36"
          )


          # =================================================
          # الأقسام
          # =================================================

          feeds = [

              {
                  "category": "matches",
                  "name": "أقوى المواجهات",
                  "queries": [
                      "أقوى مباريات كرة القدم",
                      "مباريات كرة القدم اليوم",
                      "المواجهات الكبرى كرة القدم",
                      "معاينة مباريات كرة القدم"
                  ]
              },

              {
                  "category": "transfers",
                  "name": "أخبار الانتقالات",
                  "queries": [
                      "انتقالات كرة القدم",
                      "سوق الانتقالات كرة القدم",
                      "صفقات كرة القدم",
                      "أخبار انتقالات اللاعبين"
                  ]
              },

              {
                  "category": "stars",
                  "name": "أخبار النجوم",
                  "queries": [
                      "نجوم كرة القدم",
                      "أخبار لاعبي كرة القدم",
                      "إصابات لاعبي كرة القدم",
                      "تصريحات نجوم كرة القدم"
                  ]
              },

              {
                  "category": "national",
                  "name": "المنتخبات",
                  "queries": [
                      "أخبار المنتخبات الوطنية",
                      "منتخبات كرة القدم",
                      "كأس العالم كرة القدم",
                      "كأس أمم إفريقيا",
                      "كأس آسيا",
                      "تصفيات كأس العالم"
                  ]
              },

              {
                  "category": "history",
                  "name": "تاريخ في الكرة",
                  "queries": [
                      "أساطير كرة القدم",
                      "تاريخ كرة القدم",
                      "اللحظات التاريخية كرة القدم",
                      "نهائيات تاريخية كرة القدم",
                      "لاعبون معتزلون كرة القدم"
                  ]
              }

          ]


          # =================================================
          # أدوات
          # =================================================

          def clean_text(text):

              if not text:
                  return ""

              text = unescape(text)

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def get_text(item, tag):

              element = item.find(tag)

              if element is None:
                  return ""

              return element.text or ""


          # =================================================
          # استخراج صورة RSS
          # =================================================

          def get_rss_image(item):

              # media:content
              for element in item.iter():

                  tag = element.tag

                  if not isinstance(tag, str):
                      continue

                  if tag.endswith("content"):

                      url = element.attrib.get("url")

                      if url:
                          return url.strip()

              # media:thumbnail
              for element in item.iter():

                  tag = element.tag

                  if not isinstance(tag, str):
                      continue

                  if tag.endswith("thumbnail"):

                      url = element.attrib.get("url")

                      if url:
                          return url.strip()

              # enclosure
              enclosure = item.find("enclosure")

              if enclosure is not None:

                  url = enclosure.attrib.get("url")

                  if url:
                      return url.strip()

              return ""


          # =================================================
          # استخراج OG IMAGE من الموقع الأصلي
          # =================================================

          def get_page_image(url):

              if not url:
                  return ""

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept":
                              "text/html,application/xhtml+xml"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=12
                  ) as response:

                      content_type = (
                          response.headers
                          .get("content-type", "")
                          .lower()
                      )

                      if "text/html" not in content_type:
                          return ""

                      html = response.read(
                          500000
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  patterns = [

                      r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',

                      r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image',

                      r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)',

                      r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image'

                  ]

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          html,
                          flags=re.I
                      )

                      if match:

                          image = (
                              unescape(
                                  match.group(1)
                              )
                              .strip()
                          )

                          if image.startswith("//"):

                              image = "https:" + image

                          elif image.startswith("/"):

                              parsed = urllib.parse.urlparse(
                                  url
                              )

                              image = (
                                  parsed.scheme
                                  + "://"
                                  + parsed.netloc
                                  + image
                              )

                          if image.startswith("http"):

                              return image

              except Exception as error:

                  print(
                      "Image error:",
                      error
                  )

              return ""


          # =================================================
          # تنظيف رابط Google News
          # =================================================

          def resolve_url(url):

              if not url:
                  return ""

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      final_url = response.geturl()

                      if final_url:
                          return final_url

              except Exception as error:

                  print(
                      "URL resolve error:",
                      error
                  )

              return url


          # =================================================
          # صورة احتياطية لكل قسم
          # =================================================

          fallback_images = {

              "matches":
                  "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1200&q=85",

              "transfers":
                  "https://images.unsplash.com/photo-1553778263-73a83bab9b0c?auto=format&fit=crop&w=1200&q=85",

              "stars":
                  "https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=1200&q=85",

              "national":
                  "https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=1200&q=85",

              "history":
                  "https://images.unsplash.com/photo-1521412644187-c49fa049e84d?auto=format&fit=crop&w=1200&q=85"

          }


          # =================================================
          # تخزين الأخبار
          # =================================================

          articles = []


          # =================================================
          # معالجة كل قسم
          # =================================================

          for feed in feeds:

              category = feed["category"]

              category_name = feed["name"]

              category_articles = []


              print("")
              print(
                  "======================================"
              )

              print(
                  "CATEGORY:",
                  category_name
              )

              print(
                  "======================================"
              )


              for query in feed["queries"]:

                  if len(category_articles) >= MAX_PER_CATEGORY:
                      break


                  encoded_query = (
                      urllib.parse.quote(query)
                  )


                  rss_url = (
                      "https://news.google.com/rss/search?"
                      "q="
                      + encoded_query
                      + "&hl=ar"
                      + "&gl=DZ"
                      + "&ceid=DZ:ar"
                  )


                  print(
                      "Searching:",
                      query
                  )


                  try:

                      request = urllib.request.Request(
                          rss_url,
                          headers={
                              "User-Agent":
                                  USER_AGENT
                          }
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          xml_data = response.read()


                      root = ET.fromstring(
                          xml_data
                      )


                      items = root.findall(
                          ".//item"
                      )


                      for item in items:

                          if (
                              len(category_articles)
                              >= MAX_PER_CATEGORY
                          ):
                              break


                          title = clean_text(
                              get_text(
                                  item,
                                  "title"
                              )
                          )


                          description = clean_text(
                              get_text(
                                  item,
                                  "description"
                              )
                          )


                          link = clean_text(
                              get_text(
                                  item,
                                  "link"
                              )
                          )


                          pub_date = clean_text(
                              get_text(
                                  item,
                                  "pubDate"
                              )
                          )


                          source = clean_text(
                              get_text(
                                  item,
                                  "source"
                              )
                          )


                          if not title:
                              continue


                          # ---------------------------------
                          # إزالة عبارات Google News
                          # ---------------------------------

                          title = re.sub(
                              r"\s*-\s*Google News\s*$",
                              "",
                              title,
                              flags=re.I
                          ).strip()


                          # ---------------------------------
                          # منع التكرار داخل القسم
                          # ---------------------------------

                          duplicate = False

                          normalized_title = (
                              title
                              .lower()
                              .strip()
                          )


                          for existing in category_articles:

                              if (
                                  existing["_key"]
                                  == normalized_title
                              ):

                                  duplicate = True

                                  break


                          if duplicate:
                              continue


                          # ---------------------------------
                          # حل الرابط الأصلي
                          # ---------------------------------

                          original_link = resolve_url(
                              link
                          )


                          # ---------------------------------
                          # استخراج الصورة
                          # ---------------------------------

                          image = get_rss_image(
                              item
                          )


                          if not image:

                              image = get_page_image(
                                  original_link
                              )


                          if not image:

                              image = fallback_images.get(
                                  category,
                                  ""
                              )


                          # ---------------------------------
                          # الخبر
                          # ---------------------------------

                          article = {

                              "category":
                                  category,

                              "title_ar":
                                  title,

                              "summary_ar":
                                  description,

                              "image":
                                  image,

                              "source":
                                  source
                                  or "NOWNEX FOOTBALL",

                              "link":
                                  original_link,

                              "published":
                                  pub_date,

                              "date":
                                  pub_date,

                              "_key":
                                  normalized_title

                          }


                          category_articles.append(
                              article
                          )


                  except Exception as error:

                      print(
                          "RSS error:",
                          error
                      )


              # -------------------------------------------
              # إضافة أخبار القسم
              # -------------------------------------------

              for article in category_articles:

                  articles.append(
                      article
                  )


              print(
                  "Category articles:",
                  len(category_articles)
              )


          # =================================================
          # إزالة التكرار بين الأقسام
          # =================================================

          unique = {}

          for article in articles:

              key = (
                  article["title_ar"]
                  .lower()
                  .strip()
              )


              if key not in unique:

                  unique[key] = article


          articles = list(
              unique.values()
          )


          # =================================================
          # ترتيب الأخبار
          # =================================================

          def sort_key(article):

              return (
                  article.get(
                      "published",
                      ""
                  )
                  or ""
              )


          articles.sort(
              key=sort_key,
              reverse=True
          )


          # =================================================
          # حذف المفتاح الداخلي
          # =================================================

          for article in articles:

              article.pop(
                  "_key",
                  None
              )


          # =================================================
          # حفظ الملف
          # =================================================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(articles),

              "news":
                  articles

          }


          with open(
              NEWS_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "======================================"
          )

          print(
              "NOWNEX FOOTBALL NEWS SAVED:",
              len(articles)
          )

          print(
              "======================================"
          )


          # =================================================
          # إحصائيات الأقسام
          # =================================================

          for feed in feeds:

              category = feed["category"]

              count = sum(
                  1
                  for article in articles
                  if article["category"] == category
              )

              print(
                  category,
                  ":",
                  count
              )


      # =====================================================
      # حفظ التحديث في GitHub
      # =====================================================

      - name: Commit updated news

        run: |

          git config user.name \
            "NOWNEX Football News Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || \
            git commit \
            -m "Update NOWNEX FOOTBALL news"

          git push
