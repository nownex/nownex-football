name: Update NOWNEX FOOTBALL News

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install parser
        run: pip install requests beautifulsoup4 lxml

      - name: Build NOWNEX FOOTBALL News
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import json
          import re
          import time
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import quote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          NEWS_FILE = "data/news.json"
          MAX_PER_CATEGORY = 10
          MAX_TOTAL = 50

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36 NOWNEXBot/2.0",
              "Accept-Language": "ar,en;q=0.8",
          }

          # ------------------------------------------------------------
          # IMPORTANT: We no longer depend on one search query per section.
          # We collect a large football pool, then classify each article.
          # This prevents empty sections caused by poor Google query matches.
          # ------------------------------------------------------------

          CATEGORY_RULES = {
              "matches": [
                  "مباراة", "مباريات", "مواجهة", "تشكيلة", "تشكيل", "نتيجة",
                  "هدف", "أهداف", "دوري", "كأس", "قرعة", "الجولة", "لقاء",
                  "match", "fixture", "lineup", "result"
              ],
              "transfers": [
                  "انتقال", "انتقالات", "صفقة", "صفقات", "ينضم", "يضم", "تعاقد",
                  "عرض", "مفاوضات", "ميركاتو", "رحيل", "إعارة", "عقد", "transfer",
                  "sign", "deal", "loan"
              ],
              "stars": [
                  "رونالدو", "ميسي", "مبابي", "صلاح", "بنزيما", "هالاند", "يامال",
                  "فينيسيوس", "بيلينغهام", "نيمار", "محرز", "بلايلي", "لاعب", "نجم",
                  "إصابة", "إصابات", "تصريح", "مدرب", "coach", "player", "injury"
              ],
              "national": [
                  "منتخب", "المنتخبات", "كأس العالم", "تصفيات", "فيفا", "كاف",
                  "أمم إفريقيا", "أمم اسيا", "أوروبا", "وطني", "national", "fifa"
              ],
              "history": [
                  "تاريخ", "أسطورة", "أساطير", "ذكرى", "في مثل هذا اليوم", "نهائي تاريخي",
                  "لحظة تاريخية", "مسيرة", "معتزل", "legend", "history", "on this day"
              ]
          }

          # Targeted fallback queries ensure every section has a real source pool.
          QUERIES = [
              "كرة القدم أخبار مباريات انتقالات لاعبين منتخبات",
              "كرة القدم اليوم مباريات نتائج أهداف",
              "سوق انتقالات كرة القدم صفقات أندية لاعبين",
              "أخبار نجوم كرة القدم إصابات تصريحات",
              "المنتخبات كأس العالم تصفيات كرة القدم",
              "تاريخ كرة القدم أساطير في مثل هذا اليوم",
              "محمد صلاح مبابي رونالدو هالاند يامال كرة القدم",
              "الدوري الإنجليزي الإسباني الإيطالي السعودي كرة القدم",
              "دوري أبطال أوروبا كرة القدم",
              "كرة القدم الجزائر المنتخب الجزائري محرز بلايلي",
          ]

          SECTION_QUERIES = {
              "matches": [
                  "مباريات كرة القدم اليوم نتائج أهداف تشكيلة",
                  "مواجهات كرة القدم اليوم الدوري أبطال أوروبا",
                  "مواعيد مباريات كرة القدم نتائج"
              ],
              "transfers": [
                  "انتقالات كرة القدم صفقات ميركاتو",
                  "سوق انتقالات اللاعبين أندية كرة القدم",
                  "مفاوضات انتقال تعاقد لاعب كرة القدم"
              ],
              "stars": [
                  "أخبار نجوم كرة القدم صلاح مبابي رونالدو هالاند يامال",
                  "إصابات وتصريحات لاعبي كرة القدم",
                  "أخبار لاعبي كرة القدم"
              ],
              "national": [
                  "أخبار المنتخبات كرة القدم كأس العالم تصفيات",
                  "المنتخب الجزائري كرة القدم",
                  "كأس أمم إفريقيا منتخبات كرة القدم"
              ],
              "history": [
                  "أساطير كرة القدم تاريخ كرة القدم",
                  "في مثل هذا اليوم كرة القدم",
                  "لحظات تاريخية نهائيات كرة القدم"
              ]
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          def clean(value):
              if not value:
                  return ""
              soup = BeautifulSoup(str(value), "html.parser")
              text = soup.get_text(" ", strip=True)
              text = re.sub(r"\s+", " ", text).strip()
              return text

          def canonical_key(title):
              text = clean(title).lower()
              text = re.sub(r"[-|–—].*(google news)$", "", text, flags=re.I)
              text = re.sub(r"[^\w\u0600-\u06ff ]+", " ", text)
              return re.sub(r"\s+", " ", text).strip()

          def fetch(url, timeout=18):
              try:
                  r = SESSION.get(url, timeout=timeout, allow_redirects=True)
                  if r.ok:
                      return r.text, r.url, r.headers.get("content-type", "")
              except Exception as e:
                  print("FETCH ERROR", url[:100], str(e)[:160])
              return "", url, ""

          def google_news(query):
              url = (
                  "https://news.google.com/rss/search?q=" + quote(query)
                  + "&hl=ar&gl=DZ&ceid=DZ:ar"
              )
              xml, _, _ = fetch(url, 25)
              if not xml:
                  return []
              soup = BeautifulSoup(xml, "xml")
              out = []
              for item in soup.find_all("item"):
                  title = clean(item.title.get_text()) if item.title else ""
                  link = item.link.get_text(strip=True) if item.link else ""
                  desc = clean(item.description.get_text()) if item.description else ""
                  pub = item.pubDate.get_text(strip=True) if item.pubDate else ""
                  source = item.source.get_text(strip=True) if item.source else ""
                  if title and link:
                      out.append({"title": title, "link": link, "desc": desc, "published": pub, "source": source})
              return out

          def resolve(url):
              try:
                  r = SESSION.get(url, timeout=18, allow_redirects=True, stream=True)
                  return r.url or url
              except Exception:
                  return url

          def meta(soup, key, value):
              tag = soup.find("meta", attrs={key: value})
              return clean(tag.get("content", "")) if tag else ""

          def page_data(url):
              html, final_url, ctype = fetch(url, 20)
              if not html or "html" not in ctype.lower() and "text" not in ctype.lower():
                  return {"url": final_url or url, "image": "", "text": "", "description": ""}

              soup = BeautifulSoup(html, "lxml")
              image = (
                  meta(soup, "property", "og:image")
                  or meta(soup, "name", "twitter:image")
              )
              if image:
                  image = urljoin(final_url, image)

              description = (
                  meta(soup, "name", "description")
                  or meta(soup, "property", "og:description")
              )

              # Prefer JSON-LD articleBody when present.
              bodies = []
              for script in soup.find_all("script", type="application/ld+json"):
                  raw = script.string or script.get_text()
                  try:
                      data = json.loads(raw)
                      stack = data if isinstance(data, list) else [data]
                      for obj in stack:
                          if isinstance(obj, dict):
                              body = obj.get("articleBody")
                              if isinstance(body, str) and len(clean(body)) > 120:
                                  bodies.append(clean(body))
                  except Exception:
                      pass

              selectors = [
                  "article p",
                  "[itemprop='articleBody'] p",
                  ".article-body p",
                  ".article-content p",
                  ".story-body p",
                  ".post-content p",
                  ".entry-content p",
              ]

              paragraphs = []
              for selector in selectors:
                  for p in soup.select(selector):
                      text = clean(p.get_text(" ", strip=True))
                      if len(text) >= 45:
                          low = text.lower()
                          blocked = ["cookie", "privacy policy", "اشترك", "تسجيل الدخول", "تابعنا", "إعلان"]
                          if not any(x in low for x in blocked):
                              paragraphs.append(text)
                  if len(paragraphs) >= 8:
                      break

              body = max(bodies, key=len) if bodies else " ".join(paragraphs)
              return {"url": final_url or url, "image": image, "text": body, "description": description}

          def jina_data(url):
              # Last-resort reader. It is only used when the publisher blocks normal HTML parsing.
              try:
                  reader_url = "https://r.jina.ai/" + url
                  text, final, _ = fetch(reader_url, 25)
                  text = clean(text)
                  if len(text) < 250:
                      return ""
                  text = re.sub(r"Title:.*?Markdown Content:", " ", text, flags=re.I | re.S)
                  return clean(text)
              except Exception:
                  return ""

          def summary(title, rss_desc, page_desc, body):
              candidates = [body, page_desc, rss_desc]
              best = max((clean(x) for x in candidates if x), key=len, default="")
              best = re.sub(re.escape(clean(title)), " ", best, flags=re.I)
              best = re.sub(r"\s+", " ", best).strip()

              # 70-110 words: substantial enough for the NOWNEX card without copying an article.
              sentences = re.split(r"(?<=[.!؟])\s+", best)
              picked = []
              count = 0
              for s in sentences:
                  s = s.strip()
                  if len(s) < 35:
                      continue
                  n = len(s.split())
                  if picked and count + n > 110:
                      break
                  picked.append(s)
                  count += n
                  if count >= 70:
                      break

              result = " ".join(picked).strip()
              if len(result.split()) < 45:
                  result = " ".join(best.split()[:100])
              if len(result.split()) < 30:
                  result = clean(rss_desc)
              return result[:1000]

          def classify(article):
              text = (article["title"] + " " + article["desc"]).lower()
              scores = {k: 0 for k in CATEGORY_RULES}
              for cat, words in CATEGORY_RULES.items():
                  for word in words:
                      if word.lower() in text:
                          scores[cat] += 1
              # Strong title-first weighting.
              title = article["title"].lower()
              for cat, words in CATEGORY_RULES.items():
                  for word in words:
                      if word.lower() in title:
                          scores[cat] += 2
              return max(scores, key=scores.get), max(scores.values())

          # ------------------------------------------------------------
          # 1) Build a large candidate pool.
          # ------------------------------------------------------------
          pool = {}
          for q in QUERIES:
              print("POOL QUERY:", q)
              for a in google_news(q):
                  pool.setdefault(canonical_key(a["title"]), a)

          # 2) Add targeted candidates for categories that need them.
          for category, queries in SECTION_QUERIES.items():
              for q in queries:
                  print("SECTION QUERY:", category, q)
                  for a in google_news(q):
                      pool.setdefault(canonical_key(a["title"]), a)

          print("CANDIDATE POOL:", len(pool))

          buckets = {k: [] for k in CATEGORY_RULES}

          # First classification pass.
          for a in pool.values():
              cat, score = classify(a)
              if score > 0:
                  buckets[cat].append(a)

          # If a section is still weak, use its targeted candidates directly.
          for cat, queries in SECTION_QUERIES.items():
              if len(buckets[cat]) >= MAX_PER_CATEGORY:
                  continue
              seen = {canonical_key(x["title"]) for x in buckets[cat]}
              for q in queries:
                  for a in google_news(q):
                      k = canonical_key(a["title"])
                      if k not in seen:
                          buckets[cat].append(a)
                          seen.add(k)
                      if len(buckets[cat]) >= MAX_PER_CATEGORY * 2:
                          break
                  if len(buckets[cat]) >= MAX_PER_CATEGORY * 2:
                      break

          final = []
          seen_global = set()

          # ------------------------------------------------------------
          # 3) Every category gets its own quota.
          # ------------------------------------------------------------
          for category in ["matches", "transfers", "stars", "national", "history"]:
              print("\nPROCESSING CATEGORY:", category)
              chosen = 0
              for a in buckets[category]:
                  if chosen >= MAX_PER_CATEGORY:
                      break
                  key = canonical_key(a["title"])
                  if key in seen_global:
                      continue

                  original = resolve(a["link"])
                  print("ARTICLE:", a["title"])
                  print("URL:", original)

                  data = page_data(original)
                  body = data["text"]
                  if len(body) < 250:
                      reader = jina_data(data["url"] or original)
                      if len(reader) > len(body):
                          body = reader

                  # Never discard an article just because the publisher blocks extraction.
                  # RSS is the guaranteed fallback.
                  summ = summary(a["title"], a["desc"], data["description"], body)
                  image = data["image"]

                  if not image:
                      # Google News image is often exposed in its HTML even when RSS does not.
                      try:
                          ghtml, _, _ = fetch(a["link"], 15)
                          gsoup = BeautifulSoup(ghtml, "lxml") if ghtml else None
                          if gsoup:
                              image = meta(gsoup, "property", "og:image") or meta(gsoup, "name", "twitter:image")
                              if image:
                                  image = urljoin(a["link"], image)
                      except Exception:
                          pass

                  item = {
                      "category": category,
                      "title_ar": clean(a["title"]).replace(" - Google News", "").strip(),
                      "summary_ar": summ,
                      "image": image or "",
                      "source": a["source"] or urlparse(data["url"] or original).netloc,
                      "link": data["url"] or original,
                      "published": a["published"],
                      "date": a["published"],
                  }

                  final.append(item)
                  seen_global.add(key)
                  chosen += 1

                  print("SUMMARY WORDS:", len(summ.split()))
                  print("IMAGE:", "YES" if image else "NO")
                  time.sleep(0.15)

              print("CATEGORY FINAL:", category, chosen)

          # 4) Safety: if a category is unexpectedly empty, preserve old articles from that category.
          if len(final) < 5 and __import__('os').path.exists(NEWS_FILE):
              try:
                  with open(NEWS_FILE, encoding="utf-8") as f:
                      old = json.load(f).get("news", [])
                  old_by_cat = {c: [] for c in CATEGORY_RULES}
                  for x in old:
                      if x.get("category") in old_by_cat:
                          old_by_cat[x["category"]].append(x)
                  current_cats = {x["category"] for x in final}
                  for cat, old_items in old_by_cat.items():
                      if cat not in current_cats:
                          for x in old_items[:MAX_PER_CATEGORY]:
                              if canonical_key(x.get("title_ar", "")) not in seen_global:
                                  final.append(x)
              except Exception as e:
                  print("OLD DATA FALLBACK ERROR:", e)

          final = final[:MAX_TOTAL]

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(final),
              "news": final,
          }

          # Do not destroy the live dataset.
          if len(final) < 10:
              raise RuntimeError("Safety stop: fewer than 10 usable football stories collected")

          with open(NEWS_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("\n======================================")
          print("NOWNEX FOOTBALL SAVED:", len(final))
          for cat in CATEGORY_RULES:
              print(cat, sum(1 for x in final if x["category"] == cat))
          print("======================================")

      - name: Commit updated news
        run: |
          git config user.name "NOWNEX Football News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Rebuild NOWNEX FOOTBALL news engine"
          git push
