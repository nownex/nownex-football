# ============================================================
# DATE
# ============================================================

def get_timestamp(
    entry
):

    parsed = entry.get(
        "published_parsed"
    )


    if not parsed:

        parsed = entry.get(
            "updated_parsed"
        )


    if parsed:

        try:

            return calendar.timegm(
                parsed
            )

        except Exception:

            pass


    return 0


# ============================================================
# TIMESTAMP TO ISO
# ============================================================

def timestamp_to_iso(
    timestamp
):

    if not timestamp:
        return ""


    try:

        return datetime.fromtimestamp(

            timestamp,

            timezone.utc

        ).isoformat()

    except Exception:

        return ""


# ============================================================
# AGE
# ============================================================

def age_hours(
    timestamp
):

    if not timestamp:

        return 999999


    return max(

        0,

        (
            time.time()
            -
            timestamp
        ) / 3600

    )


# ============================================================
# DUPLICATES
# ============================================================

def remove_duplicates(
    articles
):

    result = []

    titles = set()

    links = set()


    for article in articles:

        title = normalize_title(

            article.get(
                "title",
                ""
            )

        )


        link = str(

            article.get(
                "link",
                ""
            )

        ).strip().lower()


        if not title:
            continue


        if title in titles:
            continue


        if link and link in links:
            continue


        titles.add(
            title
        )


        if link:

            links.add(
                link
            )


        result.append(
            article
        )


    return result


# ============================================================
# READ RSS
# ============================================================

def get_news():

    articles = []


    for (
        source,
        feed_url,
        category
    ) in RSS_FEEDS:

        print("")
        print(
            "=========================================="
        )


        print(
            "SOURCE:",
            source
        )


        print(
            "CATEGORY:",
            category
        )


        try:

            response = SESSION.get(

                feed_url,

                timeout=REQUEST_TIMEOUT

            )


            if response.status_code != 200:

                print(
                    "HTTP ERROR:",
                    response.status_code
                )

                continue


            feed = feedparser.parse(
                response.content
            )


            entries = feed.entries[
                :ENTRIES_PER_FEED
            ]


            print(
                "ENTRIES:",
                len(entries)
            )


            for entry in entries:

                title = clean_text(

                    entry.get(
                        "title",
                        ""
                    )

                )


                link = str(

                    entry.get(
                        "link",
                        ""
                    )

                ).strip()


                if not title or not link:

                    continue


                timestamp = get_timestamp(
                    entry
                )


                if not timestamp:

                    print(
                        "SKIP NO DATE:",
                        title[:100]
                    )

                    continue


                age = age_hours(
                    timestamp
                )


                if age > MAX_AGE_HOURS:

                    print(
                        f"SKIP OLD {age:.1f}h:",
                        title[:100]
                    )

                    continue


                # ------------------------------------------------
                # الوصف
                # ------------------------------------------------

                description = clean_text(

                    entry.get(
                        "summary",
                        entry.get(
                            "description",
                            ""
                        )
                    )

                )


                if not description:

                    content = entry.get(
                        "content",
                        []
                    )


                    if (
                        isinstance(
                            content,
                            list
                        )
                        and
                        content
                    ):

                        first = content[0]


                        if isinstance(
                            first,
                            dict
                        ):

                            description = clean_text(

                                first.get(
                                    "value",
                                    ""
                                )

                            )


                # ------------------------------------------------
                # الصورة من RSS فقط في البداية
                # ------------------------------------------------

                image = extract_rss_image(
                    entry
                )


                published = clean_text(

                    entry.get(
                        "published",
                        entry.get(
                            "updated",
                            ""
                        )
                    )

                )


                articles.append({

                    "title":
                        title,

                    "description":
                        description,

                    "link":
                        link,

                    "source":
                        source,

                    "category":
                        category,

                    "image":
                        image,

                    "published":
                        published,

                    "_timestamp":
                        timestamp,

                    "_age":
                        age

                })


        except Exception as error:

            print(
                "RSS ERROR:",
                source,
                str(error)[:250]
            )


    # --------------------------------------------------------
    # duplicates
    # --------------------------------------------------------

    articles = remove_duplicates(
        articles
    )


    # --------------------------------------------------------
    # newest first
    # --------------------------------------------------------

    articles.sort(

        key=lambda x:
            x.get(
                "_timestamp",
                0
            ),

        reverse=True

    )


    print("")
    print(
        "=========================================="
    )


    print(
        "TOTAL FRESH ARTICLES:",
        len(articles)
    )


    print(
        "=========================================="
    )


    return articles


# ============================================================
# SELECT ARTICLES
# ============================================================

def select_articles(
    articles
):

    selected = []


    for category in CATEGORIES:

        candidates = [

            article

            for article in articles

            if article.get(
                "category"
            ) == category

        ]


        print("")
        print(
            category,
            "AVAILABLE:",
            len(candidates)
        )


        count = 0


        for article in candidates:

            if count >= MAX_PER_CATEGORY:

                break


            selected.append(
                article
            )


            count += 1


        print(
            category,
            "SELECTED:",
            count
        )


        if count < MIN_PER_CATEGORY:

            raise RuntimeError(

                f"Not enough fresh news for "
                f"{category}: "
                f"{count}/{MIN_PER_CATEGORY}"

            )


    # --------------------------------------------------------
    # لا نتجاوز MAX_TOTAL
    # --------------------------------------------------------

    return selected[
        :MAX_TOTAL
    ]


