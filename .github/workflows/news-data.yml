def google_news_url(
    query,
    language="ar",
    country="DZ"
):

    query = f"{query} when:2d"

    return (
        "https://news.google.com/rss/search?"
        f"q={quote_plus(query)}"
        f"&hl={language}"
        f"&gl={country}"
        f"&ceid={country}:{language}"
    )


