name: Update NOWNEX FOOTBALL News

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install parser
        run: pip install requests beautifulsoup4 lxml

      - name: Build NOWNEX FOOTBALL News
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import json
          import re
          import time
          import hashlib
          import os
          from datetime import datetime, timezone
          from urllib.parse import quote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup


          NEWS_FILE = "data/news.json"

          MAX_PER_CATEGORY = 10
          MAX_TOTAL = 50


          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/136.0 Safari/537.36 "
                  "NOWNEXBot/3.0"
              ),
              "Accept-Language": "ar,en;q=0.8",
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,"
                  "image/webp,*/*;q=0.8"
              ),
          }


          # ============================================================
          # CATEGORIES
          # ============================================================

          CATEGORY_RULES = {

              "matches": [
                  "مباراة", "مباريات", "مواجهة", "تشكيلة",
                  "تشكيل", "نتيجة", "هدف", "أهداف",
                  "دوري", "كأس", "قرعة", "الجولة", "لقاء",
                  "match", "fixture", "lineup", "result"
              ],

              "transfers": [
                  "انتقال", "انتقالات", "صفقة", "صفقات",
                  "ينضم", "يضم", "تعاقد", "عرض",
                  "مفاوضات", "ميركاتو", "رحيل", "إعارة",
                  "عقد", "transfer", "sign", "deal", "loan"
              ],

              "stars": [
                  "رونالدو", "ميسي", "مبابي", "صلاح",
                  "بنزيما", "هالاند", "يامال",
                  "فينيسيوس", "بيلينغهام", "نيمار",
                  "محرز", "بلايلي", "لاعب", "نجم",
                  "إصابة", "إصابات", "تصريح",
                  "مدرب", "coach", "player", "injury"
              ],

              "national": [
                  "منتخب", "المنتخبات", "كأس العالم",
                  "تصفيات", "فيفا", "كاف",
                  "أمم إفريقيا", "أمم اسيا",
                  "أوروبا", "وطني", "national", "fifa"
              ],

              "history": [
                  "تاريخ", "أسطورة", "أساطير", "ذكرى",
                  "في مثل هذا اليوم", "نهائي تاريخي",
                  "لحظة تاريخية", "مسيرة", "معتزل",
                  "legend", "history", "on this day"
              ]
          }


          # ============================================================
          # SEARCH POOL
          # ============================================================

          QUERIES = [

              "كرة القدم أخبار مباريات انتقالات لاعبين منتخبات",

              "كرة القدم اليوم مباريات نتائج أهداف",

              "سوق انتقالات كرة القدم صفقات أندية لاعبين",

              "أخبار نجوم كرة القدم إصابات تصريحات",

              "المنتخبات كأس العالم تصفيات كرة القدم",

              "تاريخ كرة القدم أساطير في مثل هذا اليوم",

              "محمد صلاح مبابي رونالدو هالاند يامال كرة القدم",

              "الدوري الإنجليزي الإسباني الإيطالي السعودي كرة القدم",

              "دوري أبطال أوروبا كرة القدم",

              "كرة القدم الجزائر المنتخب الجزائري محرز بلايلي",
          ]


          SECTION_QUERIES = {

              "matches": [
                  "مباريات كرة القدم اليوم نتائج أهداف تشكيلة",
                  "مواجهات كرة القدم اليوم الدوري أبطال أوروبا",
                  "مواعيد مباريات كرة القدم نتائج"
              ],

              "transfers": [
                  "انتقالات كرة القدم صفقات ميركاتو",
                  "سوق انتقالات اللاعبين أندية كرة القدم",
                  "مفاوضات انتقال تعاقد لاعب كرة القدم"
              ],

              "stars": [
                  "أخبار نجوم كرة القدم صلاح مبابي رونالدو هالاند يامال",
                  "إصابات وتصريحات لاعبي كرة القدم",
                  "أخبار لاعبي كرة القدم"
              ],

              "national": [
                  "أخبار المنتخبات كرة القدم كأس العالم تصفيات",
                  "المنتخب الجزائري كرة القدم",
                  "كأس أمم إفريقيا منتخبات كرة القدم"
              ],

              "history": [
                  "أساطير كرة القدم تاريخ كرة القدم",
                  "في مثل هذا اليوم كرة القدم",
                  "لحظات تاريخية نهائيات كرة القدم"
              ]
          }


          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)


          # ============================================================
          # CLEAN
          # ============================================================

          def clean(value):

              if not value:
                  return ""

              soup = BeautifulSoup(str(value), "html.parser")

              text = soup.get_text(" ", strip=True)

              text = re.sub(r"\s+", " ", text)

              return text.strip()


          # ============================================================
          # CANONICAL TITLE
          # ============================================================

          def canonical_key(title):

              text = clean(title).lower()

              text = re.sub(
                  r"[-|–—].*(google news)$",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"[^\w\u0600-\u06ff ]+",
                  " ",
                  text
              )

              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


          # ============================================================
          # FETCH
          # ============================================================

          def fetch(url, timeout=20):

              try:

                  r = SESSION.get(
                      url,
                      timeout=timeout,
                      allow_redirects=True
                  )

                  if r.ok:

                      return (
                          r.text,
                          r.url,
                          r.headers.get(
                              "content-type",
                              ""
                          )
                      )

              except Exception as e:

                  print(
                      "FETCH ERROR:",
                      url[:120],
                      str(e)[:180]
                  )

              return "", url, ""


          # ============================================================
          # GOOGLE NEWS RSS
          # ============================================================

          def google_news(query):

              url = (
                  "https://news.google.com/rss/search?q="
                  + quote(query)
                  + "&hl=ar&gl=DZ&ceid=DZ:ar"
              )

              xml, _, _ = fetch(
                  url,
                  25
              )

              if not xml:
                  return []

              soup = BeautifulSoup(
                  xml,
                  "xml"
              )

              out = []

              for item in soup.find_all("item"):

                  title = (
                      clean(item.title.get_text())
                      if item.title
                      else ""
                  )

                  link = (
                      item.link.get_text(strip=True)
                      if item.link
                      else ""
                  )

                  desc = (
                      clean(item.description.get_text())
                      if item.description
                      else ""
                  )

                  pub = (
                      item.pubDate.get_text(strip=True)
                      if item.pubDate
                      else ""
                  )

                  source = (
                      item.source.get_text(strip=True)
                      if item.source
                      else ""
                  )

                  if title and link:

                      out.append({

                          "title": title,

                          "link": link,

                          "desc": desc,

                          "published": pub,

                          "source": source

                      })

              return out


          # ============================================================
          # RESOLVE URL
          # ============================================================

          def resolve(url):

              try:

                  r = SESSION.get(
                      url,
                      timeout=20,
                      allow_redirects=True,
                      stream=True
                  )

                  return r.url or url

              except Exception:

                  return url


          # ============================================================
          # META
          # ============================================================

          def meta(
              soup,
              key,
              value
          ):

              tag = soup.find(
                  "meta",
                  attrs={
                      key: value
                  }
              )

              if tag:

                  return clean(
                      tag.get(
                          "content",
                          ""
                      )
                  )

              return ""


          # ============================================================
          # IMAGE EXTRACTION
          # ============================================================

          def extract_image(
              soup,
              final_url
          ):

              candidates = []


              # --------------------------------------------------------
              # OpenGraph
              # --------------------------------------------------------

              for prop in [
                  "og:image",
                  "og:image:url",
                  "og:image:secure_url"
              ]:

                  value = meta(
                      soup,
                      "property",
                      prop
                  )

                  if value:
                      candidates.append(value)


              # --------------------------------------------------------
              # Twitter
              # --------------------------------------------------------

              for name in [
                  "twitter:image",
                  "twitter:image:src"
              ]:

                  value = meta(
                      soup,
                      "name",
                      name
                  )

                  if value:
                      candidates.append(value)


              # --------------------------------------------------------
              # JSON-LD
              # --------------------------------------------------------

              for script in soup.find_all(
                  "script",
                  type="application/ld+json"
              ):

                  raw = (
                      script.string
                      or script.get_text()
                  )

                  try:

                      data = json.loads(raw)

                  except Exception:

                      continue


                  objects = (
                      data
                      if isinstance(data, list)
                      else [data]
                  )


                  def inspect_object(obj):

                      if not isinstance(
                          obj,
                          dict
                      ):

                          return


                      image = obj.get(
                          "image"
                      )

                      if isinstance(
                          image,
                          str
                      ):

                          candidates.append(
                              image
                          )

                      elif isinstance(
                          image,
                          list
                      ):

                          for item in image:

                              if isinstance(
                                  item,
                                  str
                              ):

                                  candidates.append(
                                      item
                                  )

                              elif isinstance(
                                  item,
                                  dict
                              ):

                                  value = (
                                      item.get(
                                          "url"
                                      )
                                      or
                                      item.get(
                                          "contentUrl"
                                      )
                                  )

                                  if value:
                                      candidates.append(
                                          value
                                      )

                      elif isinstance(
                          image,
                          dict
                      ):

                          value = (
                              image.get("url")
                              or
                              image.get("contentUrl")
                          )

                          if value:
                              candidates.append(
                                  value
                              )


                      # Sometimes the article itself
                      # contains nested objects.

                      for value in obj.values():

                          if isinstance(
                              value,
                              dict
                          ):

                              inspect_object(
                                  value
                              )

                          elif isinstance(
                              value,
                              list
                          ):

                              for item in value:

                                  if isinstance(
                                      item,
                                      dict
                                  ):

                                      inspect_object(
                                          item
                                      )


                  for obj in objects:

                      inspect_object(
                          obj
                      )


              # --------------------------------------------------------
              # <img> tags
              # --------------------------------------------------------

              for img in soup.find_all(
                  "img"
              )[:80]:

                  for attr in [
                      "src",
                      "data-src",
                      "data-original",
                      "data-lazy-src"
                  ]:

                      value = img.get(
                          attr
                      )

                      if value:

                          candidates.append(
                              value
                          )


                  srcset = img.get(
                      "srcset"
                  )

                  if srcset:

                      parts = [
                          x.strip().split(" ")[0]
                          for x in srcset.split(",")
                          if x.strip()
                      ]

                      candidates.extend(
                          parts
                      )


              # --------------------------------------------------------
              # Clean and validate
              # --------------------------------------------------------

              final_candidates = []

              for image in candidates:

                  if not image:
                      continue

                  image = urljoin(
                      final_url,
                      image
                  )

                  if image.startswith(
                      "data:"
                  ):
                      continue

                  if image not in final_candidates:

                      final_candidates.append(
                          image
                      )


              # Prefer large/obvious article images.

              for image in final_candidates:

                  low = image.lower()

                  bad_words = [
                      "logo",
                      "avatar",
                      "icon",
                      "favicon",
                      "sprite",
                      "placeholder",
                      "advert",
                      "banner"
                  ]

                  if not any(
                      word in low
                      for word in bad_words
                  ):

                      return image


              return (
                  final_candidates[0]
                  if final_candidates
                  else ""
              )


          # ============================================================
          # ARTICLE PAGE DATA
          # ============================================================

          def page_data(url):

              html, final_url, ctype = fetch(
                  url,
                  25
              )

              if not html:

                  return {
                      "url": final_url or url,
                      "image": "",
                      "text": "",
                      "description": ""
                  }


              if (
                  "html" not in ctype.lower()
                  and
                  "text" not in ctype.lower()
              ):

                  return {
                      "url": final_url or url,
                      "image": "",
                      "text": "",
                      "description": ""
                  }


              soup = BeautifulSoup(
                  html,
                  "lxml"
              )


              # --------------------------------------------------------
              # IMAGE
              # --------------------------------------------------------

              image = extract_image(
                  soup,
                  final_url or url
              )


              # --------------------------------------------------------
              # DESCRIPTION
              # --------------------------------------------------------

              description = (

                  meta(
                      soup,
                      "name",
                      "description"
                  )

                  or

                  meta(
                      soup,
                      "property",
                      "og:description"
                  )

              )


              # --------------------------------------------------------
              # JSON-LD ARTICLE BODY
              # --------------------------------------------------------

              bodies = []


              for script in soup.find_all(
                  "script",
                  type="application/ld+json"
              ):

                  raw = (
                      script.string
                      or script.get_text()
                  )

                  try:

                      data = json.loads(
                          raw
                      )

                  except Exception:

                      continue


                  objects = (
                      data
                      if isinstance(
                          data,
                          list
                      )
                      else [data]
                  )


                  for obj in objects:

                      if not isinstance(
                          obj,
                          dict
                      ):

                          continue


                      body = obj.get(
                          "articleBody"
                      )

                      if isinstance(
                          body,
                          str
                      ):

                          body = clean(
                              body
                          )

                          if len(body) > 200:

                              bodies.append(
                                  body
                              )


              # --------------------------------------------------------
              # REMOVE NOISE
              # --------------------------------------------------------

              for tag in soup([
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "iframe",
                  "nav",
                  "footer",
                  "header",
                  "aside"
              ]):

                  tag.decompose()


              # --------------------------------------------------------
              # ARTICLE SELECTORS
              # --------------------------------------------------------

              selectors = [

                  "article p",

                  "[itemprop='articleBody'] p",

                  "[itemprop='articleBody']",

                  ".article-body p",

                  ".article-content p",

                  ".story-body p",

                  ".post-content p",

                  ".entry-content p",

                  ".article__body p",

                  ".article-text p",

                  ".story-content p",

                  ".news-content p",

                  ".content-body p",

                  ".article-body",

                  ".article-content"

              ]


              paragraphs = []


              blocked = [

                  "cookie",

                  "privacy policy",

                  "terms of use",

                  "اشترك",

                  "تسجيل الدخول",

                  "تابعنا",

                  "إعلان",

                  "advertisement",

                  "newsletter",

                  "subscribe"

              ]


              for selector in selectors:

                  found = soup.select(
                      selector
                  )

                  for p in found:

                      text = clean(
                          p.get_text(
                              " ",
                              strip=True
                          )
                      )

                      if len(text) < 40:
                          continue


                      low = text.lower()


                      if any(
                          x in low
                          for x in blocked
                      ):

                          continue


                      if text not in paragraphs:

                          paragraphs.append(
                              text
                          )


                  if len(paragraphs) >= 10:

                      break


              # --------------------------------------------------------
              # CHOOSE BODY
              # --------------------------------------------------------

              body = ""


              if bodies:

                  body = max(
                      bodies,
                      key=len
                  )


              if len(body) < 500:

                  extracted = " ".join(
                      paragraphs
                  )

                  if len(extracted) > len(body):

                      body = extracted


              return {

                  "url":
                      final_url or url,

                  "image":
                      image,

                  "text":
                      clean(body),

                  "description":
                      clean(description)

              }


          # ============================================================
          # JINA FALLBACK
          # ============================================================

          def jina_data(url):

              try:

                  reader_url = (
                      "https://r.jina.ai/"
                      + url
                  )

                  text, _, _ = fetch(
                      reader_url,
                      30
                  )

                  text = clean(
                      text
                  )

                  if len(text) < 300:

                      return ""

                  text = re.sub(
                      r"Title:.*?Markdown Content:",
                      " ",
                      text,
                      flags=re.I | re.S
                  )

                  return clean(
                      text
                  )

              except Exception as e:

                  print(
                      "JINA ERROR:",
                      str(e)[:160]
                  )

                  return ""


          # ============================================================
          # EXPANDED ARABIC SUMMARY
          # ============================================================

          def expanded_summary(
              title,
              rss_desc,
              page_desc,
              body
          ):

              candidates = [

                  clean(body),

                  clean(page_desc),

                  clean(rss_desc)

              ]


              best = max(
                  candidates,
                  key=len,
                  default=""
              )


              title_clean = clean(
                  title
              )


              if title_clean:

                  best = re.sub(
                      re.escape(title_clean),
                      " ",
                      best,
                      flags=re.I
                  )


              best = re.sub(
                  r"\s+",
                  " ",
                  best
              ).strip()


              # --------------------------------------------------------
              # Split into sentences
              # --------------------------------------------------------

              sentences = re.split(
                  r"(?<=[.!؟])\s+",
                  best
              )


              selected = []

              words = 0


              for sentence in sentences:

                  sentence = sentence.strip()

                  if len(sentence) < 35:

                      continue

                  n = len(
                      sentence.split()
                  )


                  if (
                      selected
                      and
                      words + n > 220
                  ):

                      break


                  selected.append(
                      sentence
                  )

                  words += n


                  if words >= 150:

                      break


              result = " ".join(
                  selected
              ).strip()


              if len(
                  result.split()
              ) < 80:

                  result = " ".join(
                      best.split()[:220]
                  )


              if len(
                  result.split()
              ) < 50:

                  result = clean(
                      rss_desc
                  )


              return result[:2200]


          # ============================================================
          # CLASSIFICATION
          # ============================================================

          def classify(article):

              text = (
                  article["title"]
                  + " "
                  + article["desc"]
              ).lower()


              scores = {
                  k: 0
                  for k in CATEGORY_RULES
              }


              for cat, words in CATEGORY_RULES.items():

                  for word in words:

                      if word.lower() in text:

                          scores[cat] += 1


              title = article[
                  "title"
              ].lower()


              for cat, words in CATEGORY_RULES.items():

                  for word in words:

                      if word.lower() in title:

                          scores[cat] += 2


              best = max(
                  scores,
                  key=scores.get
              )


              return (
                  best,
                  scores[best]
              )


          # ============================================================
          # BUILD LARGE POOL
          # ============================================================

          pool = {}


          for q in QUERIES:

              print(
                  "POOL QUERY:",
                  q
              )

              for article in google_news(
                  q
              ):

                  key = canonical_key(
                      article["title"]
                  )

                  if key:

                      pool.setdefault(
                          key,
                          article
                      )


          # ============================================================
          # TARGETED POOL
          # ============================================================

          for category, queries in SECTION_QUERIES.items():

              for q in queries:

                  print(
                      "SECTION QUERY:",
                      category,
                      q
                  )

                  for article in google_news(
                      q
                  ):

                      key = canonical_key(
                          article["title"]
                      )

                      if key:

                          pool.setdefault(
                              key,
                              article
                          )


          print(
              "CANDIDATE POOL:",
              len(pool)
          )


          # ============================================================
          # BUCKETS
          # ============================================================

          buckets = {
              k: []
              for k in CATEGORY_RULES
          }


          for article in pool.values():

              category, score = classify(
                  article
              )

              if score > 0:

                  buckets[
                      category
                  ].append(
                      article
                  )


          # ============================================================
          # TARGETED FALLBACK
          # ============================================================

          for category, queries in SECTION_QUERIES.items():

              if len(
                  buckets[category]
              ) >= MAX_PER_CATEGORY:

                  continue


              seen = {
                  canonical_key(
                      x["title"]
                  )
                  for x in buckets[
                      category
                  ]
              }


              for q in queries:

                  for article in google_news(
                      q
                  ):

                      key = canonical_key(
                          article["title"]
                      )


                      if key not in seen:

                          buckets[
                              category
                          ].append(
                              article
                          )

                          seen.add(
                              key
                          )


                      if len(
                          buckets[category]
                      ) >= MAX_PER_CATEGORY * 2:

                          break


                  if len(
                      buckets[category]
                  ) >= MAX_PER_CATEGORY * 2:

                      break


          # ============================================================
          # BUILD FINAL
          # ============================================================

          final = []

          seen_global = set()


          for category in [
              "matches",
              "transfers",
              "stars",
              "national",
              "history"
          ]:

              print(
                  "\nPROCESSING CATEGORY:",
                  category
              )


              chosen = 0


              for article in buckets[
                  category
              ]:

                  if chosen >= MAX_PER_CATEGORY:

                      break


                  key = canonical_key(
                      article["title"]
                  )


                  if key in seen_global:

                      continue


                  original = resolve(
                      article["link"]
                  )


                  print(
                      "ARTICLE:",
                      article["title"]
                  )


                  print(
                      "URL:",
                      original
                  )


                  # ----------------------------------------------------
                  # PAGE EXTRACTION
                  # ----------------------------------------------------

                  data = page_data(
                      original
                  )


                  body = data[
                      "text"
                  ]


                  # ----------------------------------------------------
                  # JINA FALLBACK
                  # ----------------------------------------------------

                  if len(body) < 500:

                      reader = jina_data(
                          data["url"]
                          or original
                      )


                      if len(reader) > len(body):

                          body = reader


                  # ----------------------------------------------------
                  # EXPANDED ARABIC SUMMARY
                  # ----------------------------------------------------

                  summary = expanded_summary(

                      article["title"],

                      article["desc"],

                      data["description"],

                      body

                  )


                  # ----------------------------------------------------
                  # IMAGE
                  # ----------------------------------------------------

                  image = data[
                      "image"
                  ]


                  # ----------------------------------------------------
                  # IMAGE FALLBACK FROM GOOGLE RSS PAGE
                  # Only if source page did not provide one.
                  # ----------------------------------------------------

                  if not image:

                      try:

                          ghtml, gurl, _ = fetch(
                              article["link"],
                              20
                          )


                          if ghtml:

                              gsoup = BeautifulSoup(
                                  ghtml,
                                  "lxml"
                              )


                              image = extract_image(
                                  gsoup,
                                  gurl
                              )

                      except Exception as e:

                          print(
                              "GOOGLE IMAGE ERROR:",
                              str(e)[:150]
                          )


                  # ----------------------------------------------------
                  # FINAL ITEM
                  # ----------------------------------------------------

                  item = {

                      "category":
                          category,

                      "title_ar":
                          clean(
                              article["title"]
                          ).replace(
                              " - Google News",
                              ""
                          ).strip(),

                      "summary_ar":
                          summary,

                      "content_ar":
                          summary,

                      "image":
                          image or "",

                      "source":
                          article["source"]
                          or
                          urlparse(
                              data["url"]
                              or original
                          ).netloc,

                      "link":
                          data["url"]
                          or original,

                      "published":
                          article["published"],

                      "date":
                          article["published"]

                  }


                  final.append(
                      item
                  )


                  seen_global.add(
                      key
                  )


                  chosen += 1


                  print(
                      "SUMMARY WORDS:",
                      len(
                          summary.split()
                      )
                  )


                  print(
                      "IMAGE:",
                      "YES"
                      if image
                      else "NO"
                  )


                  time.sleep(
                      0.15
                  )


              print(
                  "CATEGORY FINAL:",
                  category,
                  chosen
              )


          # ============================================================
          # OLD DATA FALLBACK
          # ============================================================

          if len(final) < 5 and os.path.exists(
              NEWS_FILE
          ):

              try:

                  with open(
                      NEWS_FILE,
                      encoding="utf-8"
                  ) as f:

                      old = json.load(
                          f
                      ).get(
                          "news",
                          []
                      )


                  old_by_cat = {
                      c: []
                      for c in CATEGORY_RULES
                  }


                  for item in old:

                      category = item.get(
                          "category"
                      )


                      if category in old_by_cat:

                          old_by_cat[
                              category
                          ].append(
                              item
                          )


                  current_cats = {
                      x["category"]
                      for x in final
                  }


                  for category, old_items in old_by_cat.items():

                      if category not in current_cats:

                          for item in old_items[
                              :MAX_PER_CATEGORY
                          ]:

                              key = canonical_key(
                                  item.get(
                                      "title_ar",
                                      ""
                                  )
                              )


                              if key not in seen_global:

                                  final.append(
                                      item
                                  )

              except Exception as e:

                  print(
                      "OLD DATA FALLBACK ERROR:",
                      e
                  )


          # ============================================================
          # LIMIT
          # ============================================================

          final = final[
              :MAX_TOTAL
          ]


          # ============================================================
          # SAFETY
          # ============================================================

          if len(final) < 10:

              raise RuntimeError(
                  "Safety stop: fewer than 10 usable football stories collected"
              )


          # ============================================================
          # OUTPUT
          # ============================================================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(final),

              "news":
                  final

          }


          with open(
              NEWS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "\n======================================"
          )

          print(
              "NOWNEX FOOTBALL SAVED:",
              len(final)
          )


          for category in CATEGORY_RULES:

              print(
                  category,
                  sum(
                      1
                      for x in final
                      if x["category"] == category
                  )
              )


          print(
              "======================================"
          )


      - name: Commit updated news
        run: |
          git config user.name "NOWNEX Football News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Improve NOWNEX football articles and images"
          git push
