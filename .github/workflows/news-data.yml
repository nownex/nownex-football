name: Update NOWNEX FOOTBALL News

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4 lxml trafilatura

      - name: Build NOWNEX FOOTBALL News
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |

          import os
          import re
          import json
          import time
          import hashlib
          import requests
          import trafilatura

          from bs4 import BeautifulSoup
          from urllib.parse import quote, urljoin, urlparse
          from datetime import datetime, timezone


          # ============================================================
          # SETTINGS
          # ============================================================

          NEWS_FILE = "data/news.json"
          IMAGE_DIR = "assets/news"

          MAX_PER_CATEGORY = 10
          MAX_TOTAL = 50

          os.makedirs(IMAGE_DIR, exist_ok=True)


          # ============================================================
          # HTTP
          # ============================================================

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/136.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "ar,en-US;q=0.9,en;q=0.8",
          }

          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # CATEGORIES
          # ============================================================

          CATEGORIES = {

              "matches": [
                  "مباراة",
                  "مباريات",
                  "مواجهة",
                  "مواجهات",
                  "نتيجة",
                  "نتائج",
                  "هدف",
                  "أهداف",
                  "تشكيلة",
                  "تشكيل",
                  "الجولة",
                  "لقاء",
                  "دوري",
                  "كأس",
                  "match",
                  "matches",
                  "result",
                  "fixture"
              ],

              "transfers": [
                  "انتقال",
                  "انتقالات",
                  "صفقة",
                  "صفقات",
                  "ميركاتو",
                  "ينضم",
                  "انضم",
                  "تعاقد",
                  "توقيع",
                  "مفاوضات",
                  "عرض",
                  "إعارة",
                  "رحيل",
                  "transfer",
                  "transfers",
                  "signing",
                  "deal",
                  "loan"
              ],

              "stars": [
                  "رونالدو",
                  "ميسي",
                  "مبابي",
                  "صلاح",
                  "هالاند",
                  "فينيسيوس",
                  "بيلينغهام",
                  "يامال",
                  "نيمار",
                  "محرز",
                  "بلايلي",
                  "نجم",
                  "نجوم",
                  "لاعب",
                  "لاعبين",
                  "إصابة",
                  "إصابات",
                  "تصريح",
                  "player",
                  "star",
                  "injury"
              ],

              "national": [
                  "منتخب",
                  "منتخبات",
                  "المنتخب",
                  "كأس العالم",
                  "تصفيات",
                  "فيفا",
                  "فيفا",
                  "كاف",
                  "أمم إفريقيا",
                  "أمم أفريقيا",
                  "أمم أوروبا",
                  "وطني",
                  "national",
                  "fifa"
              ],

              "history": [
                  "تاريخ",
                  "أسطورة",
                  "أساطير",
                  "ذكرى",
                  "في مثل هذا اليوم",
                  "لحظة تاريخية",
                  "نهائي تاريخي",
                  "مسيرة",
                  "معتزل",
                  "legend",
                  "history"
              ]
          }


          # ============================================================
          # SEARCHES
          # ============================================================

          SEARCHES = {

              "matches": [
                  "كرة القدم مباريات اليوم نتائج أهداف تشكيلات",
                  "مواجهات كرة القدم اليوم نتائج أهداف",
                  "مباريات كرة القدم اليوم"
              ],

              "transfers": [
                  "انتقالات كرة القدم صفقات ميركاتو",
                  "سوق انتقالات اللاعبين كرة القدم",
                  "تعاقدات صفقات أندية كرة القدم"
              ],

              "stars": [
                  "أخبار نجوم كرة القدم صلاح مبابي رونالدو هالاند يامال",
                  "أخبار لاعبي كرة القدم إصابات تصريحات",
                  "نجوم كرة القدم اليوم"
              ],

              "national": [
                  "أخبار المنتخبات كرة القدم",
                  "المنتخب الجزائري كرة القدم",
                  "كأس العالم تصفيات المنتخبات"
              ],

              "history": [
                  "تاريخ كرة القدم أساطير",
                  "في مثل هذا اليوم كرة القدم",
                  "لحظات تاريخية كرة القدم"
              ]
          }


          # ============================================================
          # CLEAN TEXT
          # ============================================================

          def clean(text):

              if not text:
                  return ""

              text = BeautifulSoup(
                  str(text),
                  "html.parser"
              ).get_text(" ", strip=True)

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # ============================================================
          # KEY
          # ============================================================

          def key_for(title):

              text = clean(title).lower()

              text = re.sub(
                  r"[^\w\u0600-\u06ff ]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # ============================================================
          # GET URL
          # ============================================================

          def get(url, timeout=25):

              try:

                  r = session.get(
                      url,
                      timeout=timeout,
                      allow_redirects=True
                  )

                  if r.ok:
                      return r

              except Exception as e:

                  print(
                      "REQUEST ERROR:",
                      str(e)[:150]
                  )

              return None


          # ============================================================
          # GOOGLE NEWS
          # ============================================================

          def google_news(query):

              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + quote(query)
                  + "&hl=ar&gl=DZ&ceid=DZ:ar"
              )

              r = get(
                  rss_url,
                  30
              )

              if not r:
                  return []

              soup = BeautifulSoup(
                  r.text,
                  "xml"
              )

              results = []

              for item in soup.find_all("item"):

                  title = clean(
                      item.title.get_text()
                      if item.title
                      else ""
                  )

                  link = (
                      item.link.get_text(strip=True)
                      if item.link
                      else ""
                  )

                  description = clean(
                      item.description.get_text()
                      if item.description
                      else ""
                  )

                  published = (
                      item.pubDate.get_text(strip=True)
                      if item.pubDate
                      else ""
                  )

                  source = (
                      item.source.get_text(strip=True)
                      if item.source
                      else ""
                  )

                  if title and link:

                      results.append({
                          "title": title,
                          "link": link,
                          "description": description,
                          "published": published,
                          "source": source
                      })

              return results


          # ============================================================
          # RESOLVE GOOGLE NEWS URL
          # ============================================================

          def resolve_url(url):

              r = get(
                  url,
                  25
              )

              if r:
                  return r.url

              return url


          # ============================================================
          # META
          # ============================================================

          def get_meta(soup, attr, value):

              tag = soup.find(
                  "meta",
                  attrs={attr: value}
              )

              if tag:
                  return clean(
                      tag.get("content", "")
                  )

              return ""


          # ============================================================
          # FIND IMAGE
          # ============================================================

          def find_image(soup, base_url):

              candidates = []


              # OpenGraph

              for name in [
                  "og:image",
                  "og:image:url",
                  "og:image:secure_url"
              ]:

                  value = get_meta(
                      soup,
                      "property",
                      name
                  )

                  if value:
                      candidates.append(value)


              # Twitter

              for name in [
                  "twitter:image",
                  "twitter:image:src"
              ]:

                  value = get_meta(
                      soup,
                      "name",
                      name
                  )

                  if value:
                      candidates.append(value)


              # JSON-LD

              for script in soup.find_all(
                  "script",
                  type="application/ld+json"
              ):

                  raw = (
                      script.string
                      or script.get_text()
                  )

                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue


                  objects = (
                      data
                      if isinstance(data, list)
                      else [data]
                  )


                  for obj in objects:

                      if not isinstance(obj, dict):
                          continue

                      image = obj.get("image")

                      if isinstance(image, str):
                          candidates.append(image)

                      elif isinstance(image, list):

                          for item in image:

                              if isinstance(item, str):
                                  candidates.append(item)

                              elif isinstance(item, dict):

                                  value = (
                                      item.get("url")
                                      or
                                      item.get("contentUrl")
                                  )

                                  if value:
                                      candidates.append(value)

                      elif isinstance(image, dict):

                          value = (
                              image.get("url")
                              or
                              image.get("contentUrl")
                          )

                          if value:
                              candidates.append(value)


              # IMG

              for img in soup.find_all("img"):

                  for attr in [
                      "src",
                      "data-src",
                      "data-original",
                      "data-lazy-src"
                  ]:

                      value = img.get(attr)

                      if value:
                          candidates.append(value)


                  srcset = img.get("srcset")

                  if srcset:

                      for part in srcset.split(","):

                          value = part.strip().split(" ")[0]

                          if value:
                              candidates.append(value)


              # Clean

              for image in candidates:

                  if not image:
                      continue

                  image = urljoin(
                      base_url,
                      image
                  )

                  if image.startswith("data:"):
                      continue

                  low = image.lower()

                  bad = [
                      "logo",
                      "favicon",
                      "avatar",
                      "icon",
                      "sprite",
                      "placeholder"
                  ]

                  if any(x in low for x in bad):
                      continue

                  return image


              return ""


          # ============================================================
          # ARTICLE TEXT
          # ============================================================

          def extract_article(url):

              r = get(
                  url,
                  30
              )

              if not r:
                  return {
                      "url": url,
                      "text": "",
                      "image": "",
                      "description": ""
                  }


              final_url = r.url

              html = r.text

              soup = BeautifulSoup(
                  html,
                  "lxml"
              )


              image = find_image(
                  soup,
                  final_url
              )


              description = (

                  get_meta(
                      soup,
                      "name",
                      "description"
                  )

                  or

                  get_meta(
                      soup,
                      "property",
                      "og:description"
                  )
              )


              # --------------------------------------------------------
              # TRafilatura
              # --------------------------------------------------------

              text = ""

              try:

                  text = trafilatura.extract(
                      html,
                      include_comments=False,
                      include_tables=False,
                      include_links=False,
                      favor_precision=False,
                      favor_recall=True
                  ) or ""

              except Exception as e:

                  print(
                      "TRAFILATURA ERROR:",
                      str(e)[:150]
                  )


              text = clean(text)


              # --------------------------------------------------------
              # BeautifulSoup fallback
              # --------------------------------------------------------

              if len(text) < 500:

                  for tag in soup([
                      "script",
                      "style",
                      "noscript",
                      "nav",
                      "footer",
                      "header",
                      "aside",
                      "svg",
                      "iframe"
                  ]):

                      tag.decompose()


                  selectors = [

                      "article p",

                      "[itemprop='articleBody'] p",

                      ".article-body p",

                      ".article-content p",

                      ".story-body p",

                      ".story-content p",

                      ".post-content p",

                      ".entry-content p",

                      ".news-content p",

                      ".content-body p",

                      "main p"

                  ]


                  paragraphs = []


                  for selector in selectors:

                      for p in soup.select(selector):

                          value = clean(
                              p.get_text(
                                  " ",
                                  strip=True
                              )
                          )

                          if len(value) < 35:
                              continue

                          if value not in paragraphs:
                              paragraphs.append(value)


                      if len(paragraphs) >= 8:
                          break


                  text = " ".join(
                      paragraphs
                  )


              return {
                  "url": final_url,
                  "text": clean(text),
                  "image": image,
                  "description": clean(description)
              }


          # ============================================================
          # TRANSLATE TO ARABIC
          # ============================================================

          def translate_chunk(text):

              text = text.strip()

              if not text:
                  return ""

              try:

                  url = (
                      "https://translate.googleapis.com/"
                      "translate_a/single"
                  )

                  params = {
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "ar",
                      "dt": "t",
                      "q": text
                  }

                  r = session.get(
                      url,
                      params=params,
                      timeout=30
                  )

                  if not r.ok:
                      return text

                  data = r.json()

                  parts = []

                  for item in data[0]:

                      if item and item[0]:
                          parts.append(item[0])

                  translated = "".join(parts).strip()

                  return translated or text

              except Exception as e:

                  print(
                      "TRANSLATION ERROR:",
                      str(e)[:150]
                  )

                  return text


          def translate_arabic(text):

              text = clean(text)

              if not text:
                  return ""

              # إذا كان النص عربيًا بشكل واضح
              arabic_chars = len(
                  re.findall(
                      r"[\u0600-\u06ff]",
                      text
                  )
              )

              total_chars = max(
                  len(text),
                  1
              )

              if arabic_chars / total_chars > 0.65:
                  return text


              # تقسيم النص حتى لا يتجاوز طلب الترجمة حجمه

              chunks = []

              current = ""

              sentences = re.split(
                  r"(?<=[.!?؟])\s+",
                  text
              )

              for sentence in sentences:

                  sentence = sentence.strip()

                  if not sentence:
                      continue

                  if len(current) + len(sentence) > 2800:

                      if current:
                          chunks.append(current)

                      current = sentence

                  else:

                      if current:
                          current += " " + sentence
                      else:
                          current = sentence


              if current:
                  chunks.append(current)


              translated_parts = []

              for chunk in chunks:

                  translated_parts.append(
                      translate_chunk(chunk)
                  )

                  time.sleep(0.25)


              return clean(
                  " ".join(
                      translated_parts
                  )
              )


          # ============================================================
          # SAVE IMAGE LOCALLY
          # ============================================================

          def save_image(image_url, article_key):

              if not image_url:
                  return ""


              try:

                  r = session.get(
                      image_url,
                      timeout=30,
                      stream=True
                  )

                  if not r.ok:
                      return ""


                  content_type = (
                      r.headers.get(
                          "content-type",
                          ""
                      ).lower()
                  )


                  extension = ".jpg"


                  if "png" in content_type:
                      extension = ".png"

                  elif "webp" in content_type:
                      extension = ".webp"

                  elif "gif" in content_type:
                      extension = ".gif"

                  elif "jpeg" in content_type:
                      extension = ".jpg"


                  filename = (
                      hashlib.md5(
                          article_key.encode(
                              "utf-8"
                          )
                      ).hexdigest()
                      + extension
                  )


                  path = os.path.join(
                      IMAGE_DIR,
                      filename
                  )


                  with open(
                      path,
                      "wb"
                  ) as f:

                      size = 0

                      for chunk in r.iter_content(
                          8192
                      ):

                          if not chunk:
                              continue

                          f.write(chunk)

                          size += len(chunk)

                          if size > 8 * 1024 * 1024:
                              break


                  if os.path.getsize(path) < 1000:

                      try:
                          os.remove(path)
                      except:
                          pass

                      return ""


                  return (
                      "assets/news/"
                      + filename
                  )


              except Exception as e:

                  print(
                      "IMAGE DOWNLOAD ERROR:",
                      str(e)[:150]
                  )

                  return ""


          # ============================================================
          # CLASSIFY
          # ============================================================

          def classify(title, description):

              text = (
                  clean(title)
                  + " "
                  + clean(description)
              ).lower()


              scores = {
                  category: 0
                  for category in CATEGORIES
              }


              for category, words in CATEGORIES.items():

                  for word in words:

                      if word.lower() in text:
                          scores[category] += 1


                      if word.lower() in title.lower():
                          scores[category] += 2


              best = max(
                  scores,
                  key=scores.get
              )


              return best


          # ============================================================
          # COLLECT
          # ============================================================

          buckets = {
              category: []
              for category in CATEGORIES
          }

          seen = set()


          for category, queries in SEARCHES.items():

              print(
                  "\n================================"
              )

              print(
                  "SEARCHING:",
                  category
              )

              print(
                  "================================"
              )


              for query in queries:

                  print(
                      "QUERY:",
                      query
                  )


                  articles = google_news(
                      query
                  )


                  for article in articles:

                      key = key_for(
                          article["title"]
                      )

                      if not key:
                          continue

                      if key in seen:
                          continue

                      seen.add(key)


                      detected = classify(
                          article["title"],
                          article["description"]
                      )


                      # نحافظ على القسم المطلوب
                      # إذا لم يكن التصنيف واضحًا

                      if detected != category:

                          detected = category


                      buckets[
                          detected
                      ].append(article)


                      if len(
                          buckets[detected]
                      ) >= 30:

                          continue


                  time.sleep(0.4)


          # ============================================================
          # BUILD FINAL
          # ============================================================

          final = []

          global_seen = set()


          for category in [
              "matches",
              "transfers",
              "stars",
              "national",
              "history"
          ]:

              print(
                  "\nPROCESSING:",
                  category
              )


              selected = 0


              for article in buckets[
                  category
              ]:

                  if selected >= MAX_PER_CATEGORY:
                      break


                  key = key_for(
                      article["title"]
                  )


                  if key in global_seen:
                      continue


                  print(
                      "\nARTICLE:",
                      article["title"]
                  )


                  # ----------------------------------------------------
                  # ORIGINAL PAGE
                  # ----------------------------------------------------

                  original_url = resolve_url(
                      article["link"]
                  )


                  print(
                      "ORIGINAL:",
                      original_url
                  )


                  # ----------------------------------------------------
                  # EXTRACT
                  # ----------------------------------------------------

                  data = extract_article(
                      original_url
                  )


                  article_text = data[
                      "text"
                  ]


                  image_url = data[
                      "image"
                  ]


                  # ----------------------------------------------------
                  # إذا كان النص قصيرًا
                  # نحاول Jina Reader
                  # ----------------------------------------------------

                  if len(article_text) < 500:

                      try:

                          jina_url = (
                              "https://r.jina.ai/"
                              + original_url
                          )

                          jr = session.get(
                              jina_url,
                              timeout=40
                          )


                          if jr.ok:

                              jina_text = clean(
                                  jr.text
                              )


                              if len(
                                  jina_text
                              ) > len(
                                  article_text
                              ):

                                  article_text = (
                                      jina_text
                                  )

                      except Exception as e:

                          print(
                              "JINA ERROR:",
                              str(e)[:150]
                          )


                  # ----------------------------------------------------
                  # REMOVE JINA HEADER NOISE
                  # ----------------------------------------------------

                  article_text = re.sub(
                      r"^Title:.*?(?:Markdown Content:|$)",
                      "",
                      article_text,
                      flags=re.I | re.S
                  )

                  article_text = clean(
                      article_text
                  )


                  # ----------------------------------------------------
                  # TRANSLATION
                  # ----------------------------------------------------

                  if article_text:

                      content_ar = (
                          translate_arabic(
                              article_text
                          )
                      )

                  else:

                      content_ar = translate_arabic(
                          article["description"]
                      )


                  # ----------------------------------------------------
                  # NEVER USE ONLY TITLE AS CONTENT
                  # ----------------------------------------------------

                  if (
                      len(content_ar.split())
                      < 50
                  ):

                      fallback = translate_arabic(
                          article["description"]
                      )


                      if len(
                          fallback.split()
                      ) > len(
                          content_ar.split()
                      ):

                          content_ar = fallback


                  # ----------------------------------------------------
                  # SUMMARY = FIRST PART
                  # وليس استبدال المقال الكامل
                  # ----------------------------------------------------

                  words = content_ar.split()

                  summary_ar = " ".join(
                      words[:120]
                  )


                  # ----------------------------------------------------
                  # LOCAL IMAGE
                  # ----------------------------------------------------

                  local_image = save_image(
                      image_url,
                      key
                  )


                  # ----------------------------------------------------
                  # ITEM
                  # ----------------------------------------------------

                  item = {

                      "category":
                          category,

                      "title_ar":
                          clean(
                              article["title"]
                          ).replace(
                              " - Google News",
                              ""
                          ).strip(),

                      "summary_ar":
                          summary_ar,

                      "content_ar":
                          content_ar,

                      "image":
                          local_image,

                      "image_original":
                          image_url,

                      "source":
                          article["source"]
                          or
                          urlparse(
                              original_url
                          ).netloc,

                      "link":
                          original_url,

                      "published":
                          article["published"],

                      "date":
                          article["published"]
                  }


                  final.append(
                      item
                  )


                  global_seen.add(
                      key
                  )


                  selected += 1


                  print(
                      "CONTENT WORDS:",
                      len(
                          content_ar.split()
                      )
                  )


                  print(
                      "IMAGE:",
                      local_image
                      if local_image
                      else "NO IMAGE"
                  )


                  time.sleep(0.5)


          # ============================================================
          # SAFETY
          # ============================================================

          if len(final) < 10:

              raise RuntimeError(
                  "Safety stop: less than 10 articles."
              )


          # ============================================================
          # LIMIT
          # ============================================================

          final = final[
              :MAX_TOTAL
          ]


          # ============================================================
          # COUNTS
          # ============================================================

          counts = {}

          for category in CATEGORIES:

              counts[category] = sum(
                  1
                  for item in final
                  if item["category"] == category
              )


          # ============================================================
          # OUTPUT
          # ============================================================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(final),

              "categories":
                  counts,

              "news":
                  final
          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              NEWS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "\n========================================"
          )

          print(
              "NOWNEX FOOTBALL NEWS UPDATED"
          )

          print(
              "TOTAL:",
              len(final)
          )

          print(
              "========================================"
          )

          for category, count in counts.items():

              print(
                  category,
                  ":",
                  count
              )


      - name: Commit news and images
        run: |

          git config user.name "NOWNEX Football News Bot"

