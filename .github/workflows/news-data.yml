name: Update NOWNEX FOOTBALL News

on:

  workflow_dispatch:

  schedule:
    # تحديث الأخبار كل 3 ساعات
    - cron: "7 */3 * * *"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # تحميل المشروع
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # جلب أخبار NOWNEX FOOTBALL
      # =====================================================

      - name: Fetch NOWNEX FOOTBALL News

        shell: python

        run: |

          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape
          import re


          # =================================================
          # الأقسام الرئيسية
          # =================================================

          feeds = [

              {
                  "category": "matches",
                  "query": "كرة القدم مباريات المواجهات القمة مباراة اليوم"
              },

              {
                  "category": "transfers",
                  "query": "كرة القدم انتقالات صفقات مفاوضات انتقالات اللاعبين"
              },

              {
                  "category": "stars",
                  "query": "كرة القدم النجوم اللاعبين إصابات تصريحات أرقام"
              },

              {
                  "category": "national",
                  "query": "المنتخبات كأس العالم كأس أمم إفريقيا تصفيات كرة القدم"
              },

              {
                  "category": "history",
                  "query": "تاريخ كرة القدم أساطير كرة القدم نهائيات تاريخية"
              }

          ]


          articles = []


          # =================================================
          # تنظيف النص
          # =================================================

          def clean_text(text):

              if not text:
                  return ""

              text = unescape(text)

              text = re.sub(
                  r"<script.*?</script>",
                  "",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  "",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # =================================================
          # استخراج عنصر XML
          # =================================================

          def get_text(item, tag):

              element = item.find(tag)

              if element is None:
                  return ""

              return element.text or ""


          # =================================================
          # استخراج صورة الخبر
          #
          # Google News RSS قد يضع الصورة:
          # media:content
          # media:thumbnail
          # enclosure
          # أو داخل description
          # =================================================

          def get_image(item):

              # ---------------------------------------------
              # namespaces
              # ---------------------------------------------

              media_content = item.find(
                  "{http://search.yahoo.com/mrss/}content"
              )

              if media_content is not None:

                  image_url = (
                      media_content.attrib.get("url")
                      or
                      media_content.attrib.get("href")
                  )

                  if image_url:
                      return image_url


              media_thumbnail = item.find(
                  "{http://search.yahoo.com/mrss/}thumbnail"
              )

              if media_thumbnail is not None:

                  image_url = (
                      media_thumbnail.attrib.get("url")
                      or
                      media_thumbnail.attrib.get("href")
                  )

                  if image_url:
                      return image_url


              # ---------------------------------------------
              # enclosure
              # ---------------------------------------------

              enclosure = item.find("enclosure")

              if enclosure is not None:

                  image_url = (
                      enclosure.attrib.get("url")
                      or
                      enclosure.attrib.get("href")
                  )

                  media_type = (
                      enclosure.attrib.get("type")
                      or
                      ""
                  )

                  if (
                      image_url
                      and (
                          "image" in media_type
                          or
                          media_type == ""
                      )
                  ):

                      return image_url


              # ---------------------------------------------
              # البحث داخل description
              # ---------------------------------------------

              description = get_text(
                  item,
                  "description"
              )

              if description:

                  match = re.search(
                      r'<img[^>]+src=["\']([^"\']+)["\']',
                      description,
                      flags=re.I
                  )

                  if match:

                      return unescape(
                          match.group(1)
                      )


              return ""


          # =================================================
          # إنشاء ملخص عربي
          # =================================================

          def create_summary(title, description):

              description = clean_text(
                  description
              )

              if description:

                  # الحد الأقصى للملخص
                  if len(description) > 350:

                      description = (
                          description[:350]
                          + "..."
                      )

                  return description

              return (
                  "يتابع NOWNEX FOOTBALL "
                  "أحدث تفاصيل هذا الخبر "
                  "في عالم كرة القدم."
              )


          # =================================================
          # جلب الأخبار من Google News RSS
          # =================================================

          for feed in feeds:

              category = feed["category"]

              query = feed["query"]

              encoded_query = urllib.parse.quote(
                  query
              )


              rss_url = (
                  "https://news.google.com/rss/search?"
                  "q="
                  + encoded_query
                  +
                  "&hl=ar&gl=DZ&ceid=DZ:ar"
              )


              print(
                  "===================================="
              )

              print(
                  "Loading category:",
                  category
              )

              print(
                  "Query:",
                  query
              )


              try:

                  request = urllib.request.Request(

                      rss_url,

                      headers={
                          "User-Agent":
                          "Mozilla/5.0 "
                          "(X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "Chrome/120 Safari/537.36"
                      }

                  )


                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      xml_data = response.read()


                  root = ET.fromstring(
                      xml_data
                  )


                  items = root.findall(
                      ".//item"
                  )


                  print(
                      "Items found:",
                      len(items)
                  )


                  # -------------------------------------------------
                  # نأخذ حتى 12 خبرًا من كل قسم
                  # -------------------------------------------------

                  for item in items[:12]:

                      raw_title = get_text(
                          item,
                          "title"
                      )


                      raw_description = get_text(
                          item,
                          "description"
                      )


                      title = clean_text(
                          raw_title
                      )


                      description = clean_text(
                          raw_description
                      )


                      link = get_text(
                          item,
                          "link"
                      ).strip()


                      pub_date = get_text(
                          item,
                          "pubDate"
                      ).strip()


                      source = get_text(
                          item,
                          "source"
                      ).strip()


                      image = get_image(
                          item
                      )


                      if not title:
                          continue


                      # -------------------------------------------
                      # إنشاء ملخص
                      # -------------------------------------------

                      summary = create_summary(
                          title,
                          description
                      )


                      # -------------------------------------------
                      # البيانات الموحدة
                      #
                      # نضع أكثر من اسم للحقل حتى تكون
                      # متوافقة مع news.js و index.html
                      # -------------------------------------------

                      article = {

                          "id":
                              re.sub(
                                  r"[^a-zA-Z0-9]+",
                                  "-",
                                  title.lower()
                              )[:100],

                          "category":
                              category,

                          "title":
                              title,

                          "title_ar":
                              title,

                          "description":
                              description,

                          "summary":
                              summary,

                          "summary_ar":
                              summary,

                          "image":
                              image,

                          "source":
                              source
                              or
                              "Google News",

                          "url":
                              link,

                          "link":
                              link,

                          "date":
                              pub_date,

                          "published":
                              pub_date

                      }


                      articles.append(
                          article
                      )


              except Exception as error:

                  print(
                      "ERROR:",
                      category,
                      error
                  )


          # =====================================================
          # إزالة الأخبار المكررة
          # =====================================================

          unique = {}

          for article in articles:

              title_key = (
                  article.get(
                      "title_ar",
                      ""
                  )
                  .strip()
                  .lower()
              )


              if not title_key:
                  continue


              if title_key not in unique:

                  unique[title_key] = article


          articles = list(
              unique.values()
          )


          # =====================================================
          # ترتيب الأخبار
          # =====================================================

          def sort_key(article):

              return (
                  article.get("published")
                  or
                  article.get("date")
                  or
                  ""
              )


          articles.sort(
              key=sort_key,
              reverse=True
          )


          # =====================================================
          # الحد الأقصى
          #
          # 10 أخبار لكل قسم تقريبًا
          # =====================================================

          max_articles = 60

          articles = articles[
              :max_articles
          ]


          # =====================================================
          # إحصائيات الأقسام
          # =====================================================

          category_counts = {}

          for article in articles:

              category = article.get(
                  "category"
              )

              category_counts[category] = (
                  category_counts.get(
                      category,
                      0
                  )
                  + 1
              )


          print(
              "===================================="
          )

          print(
              "TOTAL NEWS:",
              len(articles)
          )

          print(
              "CATEGORY COUNTS:"
          )


          for category, count in category_counts.items():

              print(
                  category,
                  ":",
                  count
              )


          # =====================================================
          # ملف JSON النهائي
          # =====================================================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "count":
                  len(articles),

              "categories":
                  category_counts,

              "news":
                  articles

          }


          # =====================================================
          # إنشاء مجلد data إذا لم يكن موجودًا
          # =====================================================

          import os

          os.makedirs(
              "data",
              exist_ok=True
          )


          # =====================================================
          # حفظ الأخبار
          # =====================================================

          with open(
              "data/news.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "===================================="
          )

          print(
              "NOWNEX FOOTBALL NEWS SAVED"
          )

          print(
              "Articles:",
              len(articles)
          )

          print(
              "===================================="
          )


      # =====================================================
      # حفظ التحديث في GitHub
      # =====================================================

      - name: Commit updated news

        run: |

          git config user.name \
            "NOWNEX Football News Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || \
            git commit \
            -m "Update NOWNEX FOOTBALL news"

          git push
