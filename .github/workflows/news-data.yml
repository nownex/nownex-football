# ============================================================
# CLEAN TEXT
# ============================================================

def clean_text(value):

    value = html.unescape(
        str(value or "")
    )

    value = re.sub(
        r"<script[^>]*>.*?</script>",
        " ",
        value,
        flags=re.I | re.S
    )

    value = re.sub(
        r"<style[^>]*>.*?</style>",
        " ",
        value,
        flags=re.I | re.S
    )

    value = re.sub(
        r"<[^>]+>",
        " ",
        value
    )

    value = re.sub(
        r"\s+",
        " ",
        value
    )

    return value.strip()


# ============================================================
# NORMALIZE TITLE
# ============================================================

def normalize_title(title):

    title = clean_text(
        title
    ).lower()

    title = re.sub(
        r"[^\w\u0600-\u06FF]+",
        "",
        title
    )

    return title


# ============================================================
# VALID IMAGE URL
# ============================================================

def valid_image_url(url):

    if not url:
        return ""

    url = html.unescape(
        str(url).strip()
    )

    if url.startswith("//"):
        url = "https:" + url

    if not (
        url.startswith("http://")
        or
        url.startswith("https://")
    ):
        return ""

    return url.replace(
        "&amp;",
        "&"
    )


# ============================================================
# EXTRACT IMAGE FROM RSS
# ============================================================

def extract_rss_image(entry):

    # --------------------------------------------------------
    # media_content
    # --------------------------------------------------------

    media_content = entry.get(
        "media_content",
        []
    )

    if isinstance(
        media_content,
        list
    ):

        for media in media_content:

            if not isinstance(
                media,
                dict
            ):
                continue

            image = (
                media.get("url")
                or media.get("href")
                or media.get("src")
            )

            image = valid_image_url(
                image
            )

            if image:
                return image


    # --------------------------------------------------------
    # media_thumbnail
    # --------------------------------------------------------

    media_thumbnail = entry.get(
        "media_thumbnail",
        []
    )

    if isinstance(
        media_thumbnail,
        list
    ):

        for media in media_thumbnail:

            if not isinstance(
                media,
                dict
            ):
                continue

            image = (
                media.get("url")
                or media.get("href")
                or media.get("src")
            )

            image = valid_image_url(
                image
            )

            if image:
                return image


    # --------------------------------------------------------
    # enclosure
    # --------------------------------------------------------

    enclosures = entry.get(
        "enclosures",
        []
    )

    if isinstance(
        enclosures,
        list
    ):

        for enclosure in enclosures:

            if not isinstance(
                enclosure,
                dict
            ):
                continue

            image = (
                enclosure.get("href")
                or enclosure.get("url")
            )

            image = valid_image_url(
                image
            )

            if not image:
                continue

            mime = str(
                enclosure.get(
                    "type",
                    ""
                )
            ).lower()

            if (
                "image" in mime
                or
                re.search(
                    r"\.(jpg|jpeg|png|webp|gif)(\?|$)",
                    image,
                    re.I
                )
            ):
                return image


    # --------------------------------------------------------
    # RSS HTML
    # --------------------------------------------------------

    sources = [

        entry.get(
            "summary",
            ""
        ),

        entry.get(
            "description",
            ""
        )

    ]


    content = entry.get(
        "content",
        []
    )


    if isinstance(
        content,
        list
    ):

        for item in content:

            if isinstance(
                item,
                dict
            ):

                sources.append(
                    item.get(
                        "value",
                        ""
                    )
                )


    patterns = [

        r'<img[^>]+src=["\']([^"\']+)["\']',

        r'<img[^>]+data-src=["\']([^"\']+)["\']',

        r'<img[^>]+data-original=["\']([^"\']+)["\']',

        r'<img[^>]+data-lazy-src=["\']([^"\']+)["\']'

    ]


    for source in sources:

        source = str(
            source or ""
        )


        for pattern in patterns:

            matches = re.findall(
                pattern,
                source,
                re.I
            )


            for image in matches:

                image = valid_image_url(
                    image
                )

                if image:
                    return image


    return ""


# ============================================================
# EXTRACT PAGE IMAGES
# ============================================================

def extract_page_images(
    url
):

    if not url:
        return []


    try:

        response = SESSION.get(

            url,

            timeout=REQUEST_TIMEOUT,

            allow_redirects=True

        )


        if response.status_code != 200:

            return []


        page = response.text[
            :1_500_000
        ]


        final_url = response.url


        candidates = []


        # ----------------------------------------------------
        # OG / TWITTER
        # ----------------------------------------------------

        patterns = [

            r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',

            r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',

            r'<meta[^>]+property=["\']og:image:url["\'][^>]+content=["\']([^"\']+)["\']',

            r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image:url["\']',

            r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)["\']',

            r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image["\']'

        ]


        for pattern in patterns:

            for image in re.findall(
                pattern,
                page,
                re.I
            ):

                image = urljoin(
                    final_url,
                    html.unescape(
                        image.strip()
                    )
                )


                image = valid_image_url(
                    image
                )


                if image:
                    candidates.append(
                        image
                    )


        # ----------------------------------------------------
        # JSON-LD
        # ----------------------------------------------------

        jsonld = re.findall(

            r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>'
            r'(.*?)'
            r'</script>',

            page,

            re.I | re.S

        )


        for raw in jsonld:

            try:

                data = json.loads(
                    raw
                )

            except Exception:

                continue


            objects = []


            if isinstance(
                data,
                dict
            ):

                objects.append(
                    data
                )

                graph = data.get(
                    "@graph"
                )


                if isinstance(
                    graph,
                    list
                ):

                    objects.extend(
                        graph
                    )


            elif isinstance(
                data,
                list
            ):

                objects.extend(
                    data
                )


            for obj in objects:

                if not isinstance(
                    obj,
                    dict
                ):
                    continue


                image = obj.get(
                    "image"
                )


                if isinstance(
                    image,
                    dict
                ):

                    image = (

                        image.get("url")
                        or
                        image.get("contentUrl")

                    )


                if isinstance(
                    image,
                    list
                ):

                    for x in image:

                        if isinstance(
                            x,
                            dict
                        ):

                            x = (
                                x.get("url")
                                or
                                x.get("contentUrl")
                            )


                        if isinstance(
                            x,
                            str
                        ):

                            image = urljoin(
                                final_url,
                                x
                            )

                            image = valid_image_url(
                                image
                            )

                            if image:
                                candidates.append(
                                    image
                                )


                elif isinstance(
                    image,
                    str
                ):

                    image = urljoin(
                        final_url,
                        image
                    )

                    image = valid_image_url(
                        image
                    )

                    if image:
                        candidates.append(
                            image
                        )


        # ----------------------------------------------------
        # IMG
        # ----------------------------------------------------

        img_patterns = [

            r'<img[^>]+src=["\']([^"\']+)["\']',

            r'<img[^>]+data-src=["\']([^"\']+)["\']',

            r'<img[^>]+data-original=["\']([^"\']+)["\']',

            r'<img[^>]+data-lazy-src=["\']([^"\']+)["\']'

        ]


        for pattern in img_patterns:

            matches = re.findall(
                pattern,
                page,
                re.I
            )


            for image in matches[:100]:

                image = urljoin(
                    final_url,
                    html.unescape(
                        image.strip()
                    )
                )


                image = valid_image_url(
                    image
                )


                if image:
                    candidates.append(
                        image
                    )


        # ----------------------------------------------------
        # FILTER
        # ----------------------------------------------------

        bad_words = [

            "logo",
            "avatar",
            "favicon",
            "icon",
            "sprite",
            "placeholder",
            "advert",
            "banner",
            "pixel",
            "tracking",
            "author",
            "profile"

        ]


        result = []

        seen = set()


        for image in candidates:

            image = valid_image_url(
                image
            )


            if not image:
                continue


            low = image.lower()


            if any(
                word in low
                for word in bad_words
            ):
                continue


            if image in seen:
                continue


            seen.add(
                image
            )


            result.append(
                image
            )


        return result


    except Exception as error:

        print(
            "PAGE IMAGE ERROR:",
            str(error)[:200]
        )


        return []


# ============================================================
# IMAGE CANDIDATES
# ============================================================

def get_image_candidates(
    article_url,
    rss_image
):

    candidates = []


    if rss_image:

        rss_image = valid_image_url(
            rss_image
        )


        if rss_image:

            candidates.append(
                rss_image
            )


    page_images = extract_page_images(
        article_url
    )


    candidates.extend(
        page_images
    )


    # إزالة التكرار
    result = []

    seen = set()


    for image in candidates:

        if image in seen:
            continue


        seen.add(
            image
        )


        result.append(
            image
        )


    return result


# ============================================================
# DOWNLOAD IMAGE LOCALLY
# ============================================================

def download_image(
    image_url,
    article_key
):

    image_url = valid_image_url(
        image_url
    )


    if not image_url:
        return ""


    try:

        response = SESSION.get(

            image_url,

            timeout=REQUEST_TIMEOUT,

            stream=True,

            allow_redirects=True

        )


        if response.status_code != 200:

            print(
                "IMAGE HTTP:",
                response.status_code
            )

            return ""


        content_type = (

            response.headers
            .get(
                "Content-Type",
                ""
            )
            .lower()

        )


        # ----------------------------------------------------
        # يجب أن تكون صورة
        # ----------------------------------------------------

        if (
            "image/" not in content_type
            and
            "octet-stream" not in content_type
        ):

            print(
                "NOT AN IMAGE:",
                content_type
            )

            return ""


        # ----------------------------------------------------
        # امتداد
        # ----------------------------------------------------

        extension = ".jpg"


        if "png" in content_type:

            extension = ".png"


        elif "webp" in content_type:

            extension = ".webp"


        elif "gif" in content_type:

            extension = ".gif"


        elif "jpeg" in content_type:

            extension = ".jpg"


        else:

            path = image_url.split("?")[0].lower()


            if path.endswith(".png"):

                extension = ".png"

            elif path.endswith(".webp"):

                extension = ".webp"

            elif path.endswith(".gif"):

                extension = ".gif"

            else:

                extension = ".jpg"


        # ----------------------------------------------------
        # filename
        # ----------------------------------------------------

        safe_hash = hashlib.sha256(

            (
                article_key
                +
                image_url
            ).encode(
                "utf-8"
            )

        ).hexdigest()[:20]


        filename = (
            safe_hash
            +
            extension
        )


        os.makedirs(
            IMAGE_DIR,
            exist_ok=True
        )


        filepath = os.path.join(
            IMAGE_DIR,
            filename
        )


        # ----------------------------------------------------
        # إذا موجود
        # ----------------------------------------------------

        if os.path.exists(
            filepath
        ):

            size = os.path.getsize(
                filepath
            )


            if size >= MIN_IMAGE_BYTES:

                return (
                    "assets/news/"
                    + filename
                )


        # ----------------------------------------------------
        # تحميل آمن
        # ----------------------------------------------------

        total = 0


        with open(
            filepath,
            "wb"
        ) as output_file:

            for chunk in response.iter_content(
                chunk_size=65536
            ):

                if not chunk:
                    continue


                total += len(
                    chunk
                )


                if total > MAX_IMAGE_BYTES:

                    print(
                        "IMAGE TOO LARGE"
                    )


                    output_file.close()


                    try:

                        os.remove(
                            filepath
                        )

                    except Exception:

                        pass


                    return ""


                output_file.write(
                    chunk
                )


        # ----------------------------------------------------
        # تحقق من الحجم
        # ----------------------------------------------------

        if total < MIN_IMAGE_BYTES:

            try:

                os.remove(
                    filepath
                )

            except Exception:

                pass


            return ""


        print(
            "LOCAL IMAGE ✓:",
            filename,
            total,
            "bytes"
        )


        return (
            "assets/news/"
            + filename
        )


    except Exception as error:

        print(
            "IMAGE DOWNLOAD ERROR:",
            str(error)[:250]
        )


        try:

            if os.path.exists(
                filepath
            ):

                os.remove(
                    filepath
                )

        except Exception:

            pass


        return ""


