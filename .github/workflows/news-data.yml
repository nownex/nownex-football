# GET BEST LOCAL IMAGE
# ============================================================

def get_best_local_image(
    article_url,
    rss_image,
    article_key
):

    candidates = get_image_candidates(

        article_url,

        rss_image

    )


    print(
        "IMAGE CANDIDATES:",
