name: NOWNEX Football News Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main
    paths:
      - "news_engine.py"
      - "requirements.txt"
      - ".github/workflows/news-engine.yml"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            exit 1
          fi

          echo "GEMINI_API_KEY is available."

      - name: Run NOWNEX News Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python news_engine.py

      - name: Check generated file
        run: |
          if [ ! -f "data/news.json" ]; then
            echo "ERROR: data/news.json was not created."
            exit 1
          fi

          echo "data/news.json created successfully."

      - name: Commit updated news
        run: |
          git config user.name "NOWNEX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Update NOWNEX football news"
          git push
