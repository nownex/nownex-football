name: Update Football Data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get football data
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data

          TODAY=$(TZ=Africa/Algiers date +%Y-%m-%d)

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=${TODAY}&timezone=Africa/Algiers" \
            --header "x-apisports-key: ${API_KEY}" \
            --output data/fixtures.json

          echo "Football data updated for ${TODAY}"

      - name: Commit updated data
        run: |
          git config user.name "NOWNEX Football Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football data"
            git push
          fi
